 {t:"1 · 认识仪器",v:null,html:"<b>先认识仪器。</b>点一点台面上的仪器——滴定管、锥形瓶、铁架台、传感器盒、试剂瓶，每个都有说明书。锥形瓶里是 <b>20.0 mL 0.100 mol/L 盐酸</b>（已加 2 滴酚酞，现在无色）；滴定管里是 <b>0.100 mol/L NaOH</b>。"},

function splash(){

function playDrop(){

    if(!t0)t0=t;var k2=Math.min(1,(t-t0)/420);
    drop.setAttribute("cx",(DROP.x0+(DROP.x1-DROP.x0)*k2).toFixed(1));
    drop.setAttribute("cy",(DROP.y0+(DROP.y1-DROP.y0)*k2*k2).toFixed(1));

    m.textContent="❌ 还不是终点——pH 还没突跃，溶液依然无色。放慢速度，用 0.2 mL 的小滴加。";
  }else{
    m.textContent="❌ 过头了——现在 pH "+phOf(V).toFixed(2)+"，溶液偏碱。点「重置」，再挑战一次。";
  }
}
// 事件
$("tb-drip").addEventListener("click",doDrip);
$("tb-flow").addEventListener("click",function(){setFlow(!flowing);});
$("tb-reset").addEventListener("click",resetAll);
$("tb-quiz").addEventListener("click",quiz);
document.querySelectorAll(".tb-stepbtn").forEach(function(b){
  b.addEventListener("click",function(){setFlow(false);setStep(+b.dataset.step);});
});
var tip=$("tb-tip"),stage=$("tb-stage");
function showTip(id,x,y){
  var t=TIPS[id];if(!t)return;
  tip.innerHTML="<b>"+t[0]+"</b><span>"+t[1]+"</span>";
  tip.style.display="block";
  var r=stage.getBoundingClientRect();
  tip.style.left=Math.min(r.width-250,Math.max(8,x-r.left+14))+"px";
  tip.style.top=Math.max(8,y-r.top-10)+"px";
}
document.querySelectorAll(".tb-part").forEach(function(el){
  el.addEventListener("pointerenter",function(e){showTip(el.dataset.tip,e.clientX,e.clientY);});
  el.addEventListener("pointermove",function(e){showTip(el.dataset.tip,e.clientX,e.clientY);});
  el.addEventListener("pointerleave",function(){tip.style.display="none";});
  el.addEventListener("click",function(e){showTip(el.dataset.tip,e.clientX,e.clientY);});
});
stage.addEventListener("keydown",function(e){
  if(e.key>="1"&&e.key<="7"){setFlow(false);setStep(+e.key-1);}
  else if(e.key==="d"||e.key==="D"){doDrip();}
  else if(e.key==="c"||e.key==="C"){setFlow(!flowing);}
  else if(e.key==="r"||e.key==="R"){resetAll();}
});
update(false);
</script></body></html>
