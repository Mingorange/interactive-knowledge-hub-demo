var TIPS={"nail":["生锈铁钉","表面红棕色是 Fe₂O₃。拖时间轴看它先被酸溶掉，再露出铁。"],"beaker":["稀盐酸","先溶锈（复分解），再和铁反应（置换，产生 H₂）。"],"hcl":["稀盐酸试剂瓶","除锈的酸。注意：是“稀”盐酸，浓硫酸会让铁钝化！"]};
var $=function(id){return document.getElementById(id);};
var reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

var SOLC={"x":477.6,"y":246.4},NAILCX=477.6;
var t=0,playing=false,timer=null;
function lerp(a,b,k){return a+(b-a)*k;}
function mix(c1,c2,k){
  return "rgb("+Math.round(lerp(c1[0],c2[0],k))+","+Math.round(lerp(c1[1],c2[1],k))+","+Math.round(lerp(c1[2],c2[2],k))+")";
}
var CLEAR=[150,195,235],YELLOW=[235,175,20],GREEN=[169,214,165];
var RUST=[143,61,30],IRON=[154,158,164];
function render(){
  var k1=Math.min(1,t/50),k2=Math.max(0,(t-50)/50);
  // 溶液颜色：清→黄→浅绿（颜色是第一叙事线，加深不透明度）
  var sol=t<=50?mix(CLEAR,YELLOW,k1):mix(YELLOW,GREEN,k2);
  $("sol-liq").setAttribute("fill",sol.replace("rgb","rgba").replace(")",",.55)"));
  $("sol-liqtop").setAttribute("fill",sol.replace("rgb","rgba").replace(")",",.7)"));
  // 铁钉：红棕锈→银灰铁本体
  $("nail").setAttribute("fill",mix(RUST,IRON,k2));
  // 气泡（只在第二阶段）
  var n=Math.round(k2*12);
  for(var i=0;i<12;i++){
    var b=$("bub"+i);
    if(i<n){b.style.display="";}else{b.style.display="none";continue;}
  }
  // 阶段徽章：第一阶段强调“无气泡”，第二阶段强调“大量气泡”
  var s1=t>2&&t<=50,s2=t>50;
  $("nobub").style.display=s1?"":"none";
  $("manybub").style.display=t>55?"":"none";
  // 颜色时间线色带同步高亮
  var active=t<=2?0:(t<=50?1:2);
  for(var c=0;c<3;c++)$("cb"+c).classList.toggle("active",c===active);
  // 大字阶段横幅
  var banner=t<=2?"待开始 · 把铁钉放入稀盐酸"
    :s1?"第一阶段 · 锈溶解 —— 溶液变黄，🚫 无气泡"
    :"第二阶段 · 铁产氢 —— 大量气泡，溶液变浅绿";
  $("fx-stagebanner").textContent=banner;
  // 方程式高亮
  $("eq1").style.color=s1?"#e5484d":"";
  $("eq1").style.fontWeight=s1?"700":"";
  $("eq1").style.background=s1?"#fff0f0":"";
  $("eq2").style.color=s2?"#1f7a48":"";
  $("eq2").style.fontWeight=s2?"700":"";
  $("eq2").style.background=s2?"#eef7ef":"";
  // 读数
  var stage=t<=2?"待开始":s1?"第一阶段：锈溶解（变黄·无气泡）":"第二阶段：铁反应（冒泡·变浅绿）";
  $("fx-readline").textContent="除锈进度 "+t+"% · "+stage;
  var ro=document.querySelector("[data-readout]");
  if(ro)ro.textContent="进度 "+t+"% · "+(t<=2?"红棕锈":s1?"黄色":"浅绿");
  if(t>=100)stop();
}
function bubblesAnim(){
  if(!playing||reduceMotion)return;
  var ts=Date.now()/1000;
  var n=Math.round(Math.max(0,(t-50)/50)*12);
  for(var i=0;i<n;i++){
    var b=$("bub"+i);
    var yy=(ts*30+i*17)%44;
    b.setAttribute("cx",(NAILCX+((i*53)%18)-9).toFixed(1));
    b.setAttribute("cy",(SOLC.y+10-yy).toFixed(1));
  }
  requestAnimationFrame(bubblesAnim);
}
function play(){
  if(playing)return;
  if(t>=100)t=0;
  playing=true;$("fx-play").textContent="⏸ 暂停";$("fx-play").classList.remove("primary");
  bubblesAnim();
  timer=setInterval(function(){t=Math.min(100,t+1);$("fx-time").value=t;render();},60);
}
function stop(){
  playing=false;clearInterval(timer);
  $("fx-play").textContent="▶ 播放";$("fx-play").classList.add("primary");
}
$("fx-play").addEventListener("click",function(){playing?stop():play();});
$("fx-time").addEventListener("input",function(){stop();t=+this.value;render();});
$("fx-reset9").addEventListener("click",function(){stop();t=0;$("fx-time").value=0;render();$("fx-msg").textContent="已重置。铁钉重新生锈（并没有）。";});
function onStep(i){
  stop();
  if(i===1){t=30;$("fx-time").value=30;render();$("fx-msg").textContent="拖到约 30%：看颜色带——黄色块亮起，溶液变黄，🚫 无气泡徽章出现。";}
  if(i===2){t=75;$("fx-time").value=75;render();$("fx-msg").textContent="拖到约 75%：浅绿块亮起，大量气泡 H₂↑，铁钉露出银灰色本体。";}
  if(i===0){t=0;$("fx-time").value=0;render();}
  if(i===3){t=100;$("fx-time").value=100;render();$("fx-msg").textContent="完整走一遍：红棕 → 黄（无气泡）→ 浅绿（有气泡）。记住扫雷卡：第一阶段不产气！";}
}
render();

var $=function(id){return document.getElementById(id);};
var reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var __step=0,__hold=-1;
function renderStep(i){
  __step=i;
  var btns=document.querySelectorAll(".fx-stepbtn");
  btns.forEach(function(b,j){b.classList.toggle("active",i===j);});
  var s=STEPS[i];
  $("fx-steptext").innerHTML="<b>"+s.t.replace(/^\d+\s*[·、]\s*/,"")+"</b>　"+s.html;
  if(typeof onStep==="function")onStep(i);
}
function holdStep(i){__hold=i;renderStep(i);}
function releaseHold(){__hold=-1;}
document.querySelectorAll(".fx-stepbtn").forEach(function(b){
  b.addEventListener("click",function(){holdStep(+b.dataset.step);});
});
(function initTips(){
  var tip=$("fx-tip"),stage=$("fx-stage");
  if(!tip||!stage||typeof TIPS==="undefined")return;
  function show(id,x,y){
    var t=TIPS[id];if(!t)return;
    tip.innerHTML="<b>"+t[0]+"</b><span>"+t[1]+"</span>";
    tip.style.display="block";
    var r=stage.getBoundingClientRect();
    tip.style.left=Math.min(r.width-250,Math.max(8,x-r.left+14))+"px";
    tip.style.top=Math.max(8,y-r.top-10)+"px";
  }
  document.querySelectorAll(".fx-part").forEach(function(el){
    el.addEventListener("pointerenter",function(e){show(el.dataset.tip,e.clientX,e.clientY);});
    el.addEventListener("pointermove",function(e){show(el.dataset.tip,e.clientX,e.clientY);});
    el.addEventListener("pointerleave",function(){tip.style.display="none";});
    el.addEventListener("click",function(e){show(el.dataset.tip,e.clientX,e.clientY);});
  });
})();
