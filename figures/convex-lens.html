<div class="fx-eq">成像公式：1/u + 1/v = 1/f　（本页 f = 10cm）</div>
<div class="cv-tablewrap"><table class="cv-table">
<tr><th>物距 u</th><th>像距 v</th><th>像的性质</th><th>应用</th></tr>
<tr><td>u &gt; 2f</td><td>f &lt; v &lt; 2f</td><td>缩小、倒立的<b>实像</b></td><td>照相机</td></tr>
<tr><td>u = 2f</td><td>v = 2f</td><td>等大、倒立的<b>实像</b></td><td>—</td></tr>
<tr><td>f &lt; u &lt; 2f</td><td>v &gt; 2f</td><td>放大、倒立的<b>实像</b></td><td>投影仪</td></tr>
<tr><td>u = f</td><td>—</td><td><b>不成像</b>（平行光）</td><td>—</td></tr>
<tr><td>u &lt; f</td><td>—</td><td>正立、放大的<b>虚像</b>（同侧）</td><td>放大镜</td></tr>
</table></div>
<div class="cv-pit">⚠️ 避坑：虚像在透镜<b>同侧</b>，光屏接不到——只能眼睛透过透镜看；u 越过 f 的瞬间，像从"右侧实像"跳到"左侧虚像"，正倒也翻转了。</div>
<div class="quiz" id="quiz"><div class="quiz-title">小测验</div><div id="quiz-body"></div></div></main><script type="module">var STEPS=[{"t":"1 · 认识光具座","html":"导轨上有<b>刻度尺</b>（单位 cm），透镜固定在 0 刻度处，焦距 <b>f=10cm</b>，红色三角标出 F 和 2F。<b>拖动蜡烛</b>改变物距 u，<b>拖动光屏</b>找像。点一点各部件看说明书。"},{"t":"2 · u>2f：缩小倒立实像","html":"蜡烛推到 <b>30cm</b> 处：三条光线在透镜右侧 <b>15cm</b> 会聚，光屏上出现<b>缩小、倒立</b>的烛焰——这就是照相机的原理。"},{"t":"3 · u=2f：等大倒立实像","html":"蜡烛移到 <b>20cm</b>：像距也是 20cm，像和物<b>一样大</b>、倒立。这是三区的分界线。"},{"t":"4 · f<u<2f：放大倒立实像","html":"蜡烛推到 <b>14cm</b>：像跑到 <b>35cm</b>，变得<b>放大、倒立</b>——投影仪就用这个区。注意像离透镜越来越远。"},{"t":"5 · u=f：不成像","html":"蜡烛正好站在 <b>10cm</b> 焦点上：折射光线变成<b>一组平行光</b>，永远不会聚到一起——光屏上什么也接不到。"},{"t":"6 · u<f：正立放大虚像","html":"蜡烛推到 <b>6cm</b>：折射光线<b>发散</b>了！把它们反向延长（虚线），交点落在透镜<b>左侧</b>——正立、放大的<b>虚像</b>。虚像在蜡烛同侧，<b>光屏永远接不到</b>，只能用眼睛透过透镜看。"}];
var TIPS={"candle":["蜡烛","点燃的蜡烛是发光体（物）。左右拖动改变物距 u（5~45cm）。火焰顶端是作图的光点，物高 5cm。"],"lens":["凸透镜","焦距 f=10cm，固定在 0 刻度。平行于主轴的光线折射后过右焦点 F′，过光心的光线方向不变。"],"screen":["光屏","左右拖动（3~62cm）。只有实像能被光屏承接；虚像在透镜同侧，光屏接不到。"]};
var $=function(id){return document.getElementById(id);};
var reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

var FF=10,AXIS=12,OH=5,U0=30,S0=15;
var AXc=1.9,BXc=368.8,CZc=-2.3,DZc=243.4;
function SXw(x){return AXc*x+BXc;} function SZw(z){return CZc*z+DZc;}
var u=U0,s=S0,showMark=true,tween=null;
var roEl=document.querySelector("[data-readout]");
var C1="#e8590c",C2="#1971c2",C3="#7048e8",CD="#868e96";
function msg(t){$("fx-msg").textContent=t;}
function vOf(uu){return uu===FF?null:(uu<FF?-uu*FF/(FF-uu):uu*FF/(uu-FF));}
function zoneOf(uu){
  if(uu>2*FF)return "real-min";
  if(uu===2*FF)return "real-eq";
  if(uu>FF)return "real-mag";
  if(uu===FF)return "none";
  return "virt";
}
var ZONE_TXT={"real-min":"缩小、倒立的实像","real-eq":"等大、倒立的实像","real-mag":"放大、倒立的实像","none":"不成像（折射光线平行）","virt":"正立、放大的虚像（透镜同侧）"};
function ray(x1,z1,x2,z2,color,dash,wd){
  var d=dash?' stroke-dasharray="6 4"':"";
  return '<line x1="'+SXw(x1).toFixed(1)+'" y1="'+SZw(z1).toFixed(1)+'" x2="'+SXw(x2).toFixed(1)+'" y2="'+SZw(z2).toFixed(1)+'" stroke="'+color+'" stroke-width="'+(wd||1.6)+'" fill="none"'+d+'/>';
}
function flameAt(x,z,scale,dash,color1,color2,op){
  var s1=scale||1,sz=function(v){return (v*s1).toFixed(1);};
  var st=dash?' stroke-dasharray="4 3"':"";
  var X=SXw(x).toFixed(1),Y=SZw(z).toFixed(1);
  return '<g opacity="'+(op==null?1:op)+'"><path d="M0 0 C'+sz(-5)+' '+sz(-4)+' '+sz(-3.4)+' '+sz(-11)+' 0 '+sz(-15)+' C'+sz(3.4)+' '+sz(-11)+' '+sz(5)+' '+sz(-4)+' 0 0 Z" transform="translate('+X+' '+Y+')" fill="'+color1+'" stroke="'+color2+'" stroke-width="0.8"'+st+'/></g>';
}
function render(){
  var z=zoneOf(u),vv=vOf(u),r=[],im=[];
  var ox=-u,oz=AXIS+OH;
  var XEND=70;
  if(z==="none"){
    r.push(ray(ox,oz,0,oz,C1));
    r.push(ray(0,oz,0+10*(XEND)/10,oz+(AXIS-oz)*(XEND)/10,C1));
    r.push(ray(ox,oz,0,AXIS,C2));
    r.push(ray(0,AXIS,XEND,AXIS+(AXIS-oz)*(XEND)/u,C2));
    msg("u = f：折射光线互相平行，永远不会聚到一起——光屏上什么也接不到。");
  }else if(z==="virt"){
    var vm=-vv,ivz=AXIS+OH*vm/u;
    // 实际折射光线（发散）
    r.push(ray(ox,oz,0,oz,C1));
    r.push(ray(0,oz,XEND,oz+(AXIS-oz)*(XEND)/FF,C1));
    r.push(ray(ox,oz,0,AXIS,C2));
    r.push(ray(0,AXIS,XEND,AXIS+(AXIS-oz)*(XEND)/u,C2));
    var y3=AXIS-OH*FF/(u-FF);
    r.push(ray(ox,oz,0,y3,C3));
    r.push(ray(0,y3,XEND,y3,C3));
    // 反向延长虚线 → 虚像点
    r.push(ray(0,oz,-vm,ivz,CD,true,1.2));
    r.push(ray(0,AXIS,-vm,ivz,CD,true,1.2));
    r.push(ray(0,y3,-vm,ivz,CD,true,1.2));
    if(-vm>=-70){im.push(flameAt(-vm,ivz,vm/u,true,"rgba(255,154,60,.25)","#e8590c",0.9));}
    msg("虚像在透镜同侧（x≈"+(-vm).toFixed(1)+"cm），光屏永远接不到——只能眼睛透过透镜看。");
  }else{
    var y3=AXIS-OH*FF/(u-FF);
    // 入射
    r.push(ray(ox,oz,0,oz,C1));
    r.push(ray(ox,oz,0,AXIS,C2));
    r.push(ray(ox,oz,0,y3,C3));
    // 折射
    r.push(ray(0,oz,XEND,oz+(AXIS-oz)*(XEND)/FF,C1));
    r.push(ray(0,AXIS,XEND,AXIS+(AXIS-oz)*(XEND)/u,C2));
    r.push(ray(0,y3,XEND,y3,C3));
    // 光屏上的像
    var def=Math.abs(s-vv);
    var k=s/u,zim=AXIS-OH*s/u;
    var sharp=def<2;
    im.push(flameAt(s-1.5,zim,k,false,"#ff9a3c","#e07b1f",sharp?1:0.45));
    if(!sharp){im.push(flameAt(s-1.5,zim+1.2,k,false,"#ff9a3c","#e07b1f",0.25));}
    msg(def<2?("光屏正好在像的位置（v="+vv.toFixed(1)+"cm）："+ZONE_TXT[z]+"，最清晰！"):("光屏在 s="+s.toFixed(1)+"cm，像在 v="+vv.toFixed(1)+"cm——点「自动找像」让它变清晰。"));
  }
  $("cv-rays").innerHTML=r.join("");
  $("cv-img").innerHTML=im.join("");
  var z2=zoneOf(u),vv2=vOf(u);
  var ro="物距 u="+u.toFixed(1)+"cm · "+(vv2==null?("像距 — · "):("像距 v="+Math.abs(vv2).toFixed(1)+"cm · "))+ZONE_TXT[z2];
  $("fx-readline").textContent=ro;
  if(roEl)roEl.textContent=ro;
  $("cv-candle").setAttribute("transform","translate("+(SXw(-u)-SXw(-U0)).toFixed(1)+" 0)");
  $("cv-candle-lab").setAttribute("x",SXw(-u).toFixed(1));
  $("cv-screen").setAttribute("transform","translate("+(SXw(s)-SXw(S0)).toFixed(1)+" 0)");
  $("cv-screen-lab").setAttribute("x",SXw(s).toFixed(1));
}
function setU(nu){u=Math.min(45,Math.max(5,Math.round(nu*2)/2));render();}
function setV(ns){s=Math.min(62,Math.max(3,Math.round(ns*2)/2));render();}
function findImage(){
  var z=zoneOf(u),vv=vOf(u);
  if(z==="virt"){msg("虚像在透镜左侧，光屏接不到——自动找像只对实像有效。");return false;}
  if(z==="none"){msg("u=f 时折射光线平行，不成像——没有可找的像。");return false;}
  if(vv>62){msg("像距 v="+vv.toFixed(1)+"cm，超出了 62cm 的轨道——把蜡烛往 2f 附近挪一挪。");return false;}
  var from=s,to=vv;
  if(tween)cancelAnimationFrame(tween);tween=null;
  if(reduceMotion){setV(to);msg("光屏已移到 v="+to.toFixed(1)+"cm："+ZONE_TXT[z]+"。");return true;}
  var t0=null;
  function step(ts){
    if(t0==null)t0=ts;var k=Math.min(1,(ts-t0)/900);
    setV(from+(to-from)*(1-Math.pow(1-k,3)));
    if(k<1){tween=requestAnimationFrame(step);}else{tween=null;msg("光屏已移到 v="+to.toFixed(1)+"cm："+ZONE_TXT[z]+"。");}
  }
  tween=requestAnimationFrame(step);return true;
}
function onStep(i){
  if(i===0)return;
  var us=[0,30,20,14,10,6];
  setU(us[i]);
  if(i>=1&&i<=4)findImage();
  if(i===5)msg("蜡烛在 6cm：折射光线发散，反向延长交于透镜左侧——正立、放大的虚像。");
}
// ── 拖拽 ──
function svgX(e){
  var svg=$("cv-svg"),r=svg.getBoundingClientRect();
  return (e.clientX-r.left)/r.width*740;
}
function worldX(sx){return (sx-BXc)/AXc;}
function bindDrag(elId,setter){
  var el=$(elId),drag=false;
  el.addEventListener("pointerdown",function(e){drag=true;try{el.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault();});
  el.addEventListener("pointermove",function(e){if(!drag)return;setter(worldX(svgX(e)));});
  function up(){drag=false;}
  el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
}
bindDrag("cv-candle",setU);bindDrag("cv-screen",setV);
$("cv-find").addEventListener("click",findImage);
$("cv-markbtn").addEventListener("click",function(){
  showMark=!showMark;
  this.textContent=showMark?"隐藏 F / 2F 标记":"显示 F / 2F 标记";
  $("cv-markers").style.display=showMark?"":"none";
});
$("cv-reset").addEventListener("click",function(){setU(U0);setV(S0);msg("已重置：u=30cm，s=15cm。");});
document.getElementById("fx-stage").addEventListener("keydown",function(e){
  if(e.key>="1"&&e.key<="6")renderStep(+e.key-1);
});
// ── 小测验 ──
var QUIZ=[
  {q:"f=10cm，蜡烛放在 u=25cm 处，成什么像？",o:["缩小、倒立的实像","放大、倒立的实像","正立、放大的虚像"],a:0,
   w:"u=25>2f=20，是第一区：缩小、倒立的实像（照相机原理）。"},
  {q:"为什么光屏承接不到虚像？",o:["虚像是折射光线反向延长线的交点，实际光线并没有会聚到那里","凸透镜太小了","虚像在光屏后面"],a:0,
   w:"虚像处没有实际光线到达——光屏只能承接真实会聚的光线。"}
];
var quizState={};
function renderQuiz(){
  var html="";
  QUIZ.forEach(function(qq,qi){
    var st=quizState[qi];
    html+='<div class="quiz-q">'+(qi+1)+". "+qq.q+'</div><div class="quiz-opts">';
    qq.o.forEach(function(op,oi){
      var cls="";
      if(st!=null){if(oi===qq.a)cls=" right";else if(oi===st)cls=" wrong";}
      html+='<button class="quiz-opt'+cls+'" data-q="'+qi+'" data-o="'+oi+'">'+op+"</button>";
    });
    html+="</div>";
    if(st!=null){
      html+='<div class="quiz-why" style="display:block">'+(st===qq.a?"✓ 答对了！":"✗ 再想想。")+qq.w+"</div>";
    }
  });
  $("quiz-body").innerHTML=html;
}
$("quiz-body").addEventListener("click",function(e){
  var t=e.target;if(!t||!t.dataset||t.dataset.q==null)return;
  quizState[+t.dataset.q]=+t.dataset.o;
  renderQuiz();
});
renderQuiz();
render();

var $=function(id){return document.getElementById(id);};
var reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var __step=0,__hold=-1;
function renderStep(i){
  __step=i;
  var btns=document.querySelectorAll(".fx-stepbtn");
  btns.forEach(function(b,j){b.classList.toggle("active",i===j);});
  var s=STEPS[i];
  $("fx-steptext").innerHTML="<b>"+s.t.replace(/^\d+\s*[·、]\s*/,"")+"</b>　"+s.html;
  if(typeof onStep==="function")onStep(i);
}
function holdStep(i){__hold=i;renderStep(i);}
function releaseHold(){__hold=-1;}
document.querySelectorAll(".fx-stepbtn").forEach(function(b){
  b.addEventListener("click",function(){holdStep(+b.dataset.step);});
});
(function initTips(){
  var tip=$("fx-tip"),stage=$("fx-stage");
  if(!tip||!stage||typeof TIPS==="undefined")return;
  function show(id,x,y){
    var t=TIPS[id];if(!t)return;
    tip.innerHTML="<b>"+t[0]+"</b><span>"+t[1]+"</span>";
    tip.style.display="block";
    var r=stage.getBoundingClientRect();
    tip.style.left=Math.min(r.width-250,Math.max(8,x-r.left+14))+"px";
    tip.style.top=Math.max(8,y-r.top-10)+"px";
  }
  document.querySelectorAll(".fx-part").forEach(function(el){
    el.addEventListener("pointerenter",function(e){show(el.dataset.tip,e.clientX,e.clientY);});
    el.addEventListener("pointermove",function(e){show(el.dataset.tip,e.clientX,e.clientY);});
    el.addEventListener("pointerleave",function(){tip.style.display="none";});
    el.addEventListener("click",function(e){show(el.dataset.tip,e.clientX,e.clientY);});
  });
})();
</script></body></html>
