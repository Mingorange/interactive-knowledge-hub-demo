.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(740px,100% - 32px);margin:64px auto 96px}

.kg-back{margin:2px 0 20px}.kg-back a{color:var(--anatomy-muted);text-decoration:none;font-size:14px}

.fx-part{cursor:pointer}

  padding:8px 18px;cursor:pointer}

.mc-op.mc-arrow{color:var(--anatomy-blue)}

.mc-tally{font-size:12.5px;border-radius:16px;padding:5px 12px;border:1px solid}
.mc-tally.ok{border-color:#8fce9e;background:#e6f6ea;color:#1f7a48;font-weight:700}
.mc-tally.bad{border-color:#f0b0b0;background:#ffecec;color:#b3272e}
.mc-gmsg{text-align:center;font-size:13.5px;color:var(--anatomy-text);margin:8px 0}
.mc-success{text-align:center;font-size:16px;font-weight:700;color:#1f7a48;margin:10px 0}
.mc-nextrow{text-align:center;margin-top:10px}
.mc-confwrap{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.mc-conf{position:absolute;top:-14px;border-radius:2px;animation:mcFall 1.5s ease-in forwards}
@keyframes mcFall{to{transform:translateY(150px) rotate(540deg);opacity:0}}
.mc-note{max-width:640px;margin:10px auto 0;font-size:12.5px;color:var(--anatomy-muted);line-height:1.6;text-align:center}
.mc-note b{color:var(--anatomy-strong)}
.quiz{margin:22px 0 8px;padding:16px;border:1px solid var(--anatomy-faint);border-radius:12px;background:var(--anatomy-card)}
.quiz-title{font-size:15px;font-weight:700;color:var(--anatomy-strong);margin-bottom:10px}
.quiz-q{font-size:14px;color:var(--anatomy-strong);margin:10px 0 8px}
.quiz-opts{display:flex;gap:8px;flex-wrap:wrap}
.quiz-opt{font:13px/1.4 ui-sans-serif,system-ui,sans-serif;color:var(--anatomy-strong);background:var(--anatomy-page);border:1px solid var(--anatomy-lo);border-radius:8px;padding:6px 14px;cursor:pointer}
.quiz-opt.right{border-color:#30a46c;background:#e6f6ea;color:#1f7a48;font-weight:700}
.quiz-opt.wrong{border-color:#e5484d;background:#ffecec;color:#e5484d}
.quiz-why{font-size:13px;color:var(--anatomy-text);margin:8px 0 4px;display:none}
@media (prefers-reduced-motion:reduce){.mc-conf{animation:none}}

var ELMETA={"H":{"name":"氢","color":"#f2f2f4","stroke":"#9a9aa2","text":"#55555c"},"O":{"name":"氧","color":"#e5484d","stroke":"#b3272e","text":"#ffffff"},"C":{"name":"碳","color":"#3a3a3e","stroke":"#1c1c1f","text":"#ffffff"},"Mg":{"name":"镁","color":"#7fb069","stroke":"#55803f","text":"#ffffff"}};
var NS="http://www.w3.org/2000/svg";
var DUR=4200;
var cur=0,P=0,playing=false,playStart=null;
var atomEls=[],bondREls=[],bondPEls=[];
var lastPhase="",lastRead="__";
var roEl=document.querySelector("[data-readout]");
function ease(t){if(t<0)t=0;if(t>1)t=1;return t*t*(3-2*t);}
function lerp(a,b,t){return a+(b-a)*t;}
function atomPosAt(at,p){
  var e=ease(p);
  if(e<0.45){var t=ease(e/0.45);return [lerp(at.react[0],at.free[0],t),lerp(at.react[1],at.free[1],t),lerp(at.sr[0],at.sf[0],t),lerp(at.sr[1],at.sf[1],t)];}
  if(e>0.55){var t2=ease((e-0.55)/0.45);return [lerp(at.free[0],at.prod[0],t2),lerp(at.free[1],at.prod[1],t2),lerp(at.sf[0],at.sp[0],t2),lerp(at.sf[1],at.sp[1],t2)];}
  return [at.free[0],at.free[1],at.sf[0],at.sf[1]];
}
function buildTheater(){
  var rx=RXNS[cur];
  var gA=$("mc-atoms"),gB=$("mc-bonds"),gS=$("mc-shadows");
  gA.innerHTML="";gB.innerHTML="";gS.innerHTML="";
  atomEls=[];bondREls=[];bondPEls=[];
  rx.atoms.forEach(function(at){
    var meta=ELMETA[at.el];
    var sh=document.createElementNS(NS,"ellipse");
    sh.setAttribute("fill","rgba(30,30,40,.14)");
    sh.setAttribute("rx",(at.r*1.05).toFixed(1));sh.setAttribute("ry",(at.r*0.38).toFixed(1));
    gS.appendChild(sh);
    var g=document.createElementNS(NS,"g");
    var c=document.createElementNS(NS,"circle");
    c.setAttribute("r",at.r);c.setAttribute("fill",meta.color);c.setAttribute("stroke",meta.stroke);c.setAttribute("stroke-width","1.2");
    var hl=document.createElementNS(NS,"circle");
    hl.setAttribute("cx",(-at.r*0.34).toFixed(1));hl.setAttribute("cy",(-at.r*0.34).toFixed(1));hl.setAttribute("r",(at.r*0.36).toFixed(1));hl.setAttribute("fill","rgba(255,255,255,.55)");
    var tx=document.createElementNS(NS,"text");
    tx.setAttribute("text-anchor","middle");tx.setAttribute("y",(at.r*0.36).toFixed(1));
    tx.setAttribute("font-size",(at.el.length>1?at.r*0.8:at.r*0.95).toFixed(1));
    tx.setAttribute("font-weight","700");tx.setAttribute("fill",meta.text);
    tx.setAttribute("font-family","ui-sans-serif,system-ui,sans-serif");
    tx.textContent=at.el;
    g.appendChild(c);g.appendChild(hl);g.appendChild(tx);
    gA.appendChild(g);
    atomEls.push({g:g,sh:sh});
  });
  function mkBond(){var ln=document.createElementNS(NS,"line");ln.setAttribute("stroke","#8a8a8f");ln.setAttribute("stroke-width","5");ln.setAttribute("stroke-linecap","round");gB.appendChild(ln);return ln;}
  rx.bondsR.forEach(function(){bondREls.push(mkBond());});
  rx.bondsP.forEach(function(){bondPEls.push(mkBond());});
  $("mc-counters").innerHTML=rx.counts.map(function(cn){
    var m=ELMETA[cn[0]];
    return '<span class="mc-chip"><i style="background:'+m.color+';border-color:'+m.stroke+'"></i>'+m.name+" "+cn[0]+"：反应物 "+cn[1]+" 个 ＝ 生成物 "+cn[2]+' 个 <b>✓ 不变</b></span>';
  }).join("");
  $("bal-l1").textContent=rx.balance.l[0][0]+" · "+rx.balance.l[0][1];
  $("bal-l2").textContent=rx.balance.l[1][0]+" · "+rx.balance.l[1][1];
  $("bal-r1").textContent=rx.balance.r[0][0]+" · "+rx.balance.r[0][1];
  $("bal-ltot").textContent="反应前总质量："+rx.balance.total+" g";
  $("bal-rtot").textContent="反应后总质量："+rx.balance.total+" g";
  $("mc-eq").textContent=rx.eq;
  if(roEl)roEl.textContent=rx.totalAtoms+" 个原子 · "+rx.totalMass+"g = "+rx.totalMass+"g";
  [0,1,2].forEach(function(i){$("mc-rx-"+i).classList.toggle("active",i===cur);});
  lastRead="__";lastPhase="";
  render(P);
}
function render(p){
  var rx=RXNS[cur];
  var pos=rx.atoms.map(function(at){return atomPosAt(at,p);});
  pos.forEach(function(pp,i){
    var a=atomEls[i];if(!a)return;
    a.g.setAttribute("transform","translate("+pp[0].toFixed(1)+" "+pp[1].toFixed(1)+")");
    a.sh.setAttribute("cx",pp[2].toFixed(1));a.sh.setAttribute("cy",pp[3].toFixed(1));
  });
  var e=ease(p);
  var oR=Math.max(0,1-e/0.3),oP=Math.max(0,(e-0.7)/0.3);
  rx.bondsR.forEach(function(bd,i){
    var ln=bondREls[i];if(!ln)return;var a=pos[bd[0]],b=pos[bd[1]];
    ln.setAttribute("x1",a[0].toFixed(1));ln.setAttribute("y1",a[1].toFixed(1));
    ln.setAttribute("x2",b[0].toFixed(1));ln.setAttribute("y2",b[1].toFixed(1));
    ln.setAttribute("stroke-opacity",oR.toFixed(2));
  });
  rx.bondsP.forEach(function(bd,i){
    var ln=bondPEls[i];if(!ln)return;var a=pos[bd[0]],b=pos[bd[1]];
    ln.setAttribute("x1",a[0].toFixed(1));ln.setAttribute("y1",a[1].toFixed(1));
    ln.setAttribute("x2",b[0].toFixed(1));ln.setAttribute("y2",b[1].toFixed(1));
    ln.setAttribute("stroke-opacity",oP.toFixed(2));
  });
  var mid=Math.max(0,Math.min(1,(e-0.28)/0.14))*Math.max(0,Math.min(1,(0.72-e)/0.14));
  $("mc-midlabel").setAttribute("opacity",mid.toFixed(2));
  var total=rx.totalAtoms,free;
  if(p<=0.02||p>=0.98)free=0;
  else if(e<0.45)free=Math.round(total*ease(e/0.45));
  else if(e>0.55)free=Math.round(total*(1-ease((e-0.55)/0.45)));
  else free=total;
  var phase=p<=0?"分子完好，还没开始":p>=1?"生成物形成完毕 ✓":e<0.45?"旧分子被拆开…":e<=0.55?"原子重新组合…":"新分子正在形成…";
  if(phase!==lastPhase){lastPhase=phase;$("mc-phase").textContent=phase;}
  var rd="原子总数 <b>"+total+"</b> 个（反应前后不变） · 游离原子 <b>"+free+"</b> 个 · 总质量 <b>"+rx.totalMass+" g ＝ "+rx.totalMass+" g</b>";
  if(rd!==lastRead){lastRead=rd;$("fx-readline").innerHTML=rd;}
  if(p>=1)$("mc-banner").classList.add("show");else $("mc-banner").classList.remove("show");
}
function setP(p){
  P=p;
  var s=$("mc-slider");if(s)s.value=Math.round(p*1000);
  render(p);
}
function play(){
  if(playing)return;
  if(reduceMotion){setP(1);return;}
  if(P>=1)setP(0);
  playing=true;playStart=null;
  requestAnimationFrame(tick);
}
function tick(ts){
  if(!playing)return;
  if(playStart===null)playStart=ts-P*DUR;
  var np=Math.min(1,(ts-playStart)/DUR);
  setP(np);
  if(np<1)requestAnimationFrame(tick);else playing=false;
}
$("mc-play").addEventListener("click",play);
$("mc-reset").addEventListener("click",function(){playing=false;setP(0);});
$("mc-slider").addEventListener("input",function(){playing=false;setP(+$("mc-slider").value/1000);});
[0,1,2].forEach(function(i){
  $("mc-rx-"+i).addEventListener("click",function(){
    cur=i;playing=false;setP(0);buildTheater();
  });
});
function onStep(i){
  if(i===0){setP(0);play();}
  else if(i===1){var b=$("mc-balance");if(b&&b.scrollIntoView)b.scrollIntoView({behavior:reduceMotion?"auto":"smooth",block:"start"});}
  else if(i===2){playing=false;setP(1);}
  else if(i===3){var g=$("mc-game");if(g&&g.scrollIntoView)g.scrollIntoView({behavior:reduceMotion?"auto":"smooth",block:"start"});}
}
document.addEventListener("keydown",function(e){
  if(e.key>="1"&&e.key<="4")holdStep(+e.key-1);
  else if(e.key==="r"||e.key==="R"){playing=false;setP(0);}
});

// ── 配平小游戏 ──
var ELNAME={H:"氢",O:"氧",C:"碳"};
var ROUNDS=[
  {title:"第 1 题 · 氢气燃烧",left:[{f:"H₂",atoms:{H:2}},{f:"O₂",atoms:{O:2}}],right:[{f:"H₂O",atoms:{H:2,O:1}}],start:[1,1,1]},
  {title:"第 2 题 · 甲烷燃烧",left:[{f:"CH₄",atoms:{C:1,H:4}},{f:"O₂",atoms:{O:2}}],right:[{f:"CO₂",atoms:{C:1,O:2}},{f:"H₂O",atoms:{H:2,O:1}}],start:[1,1,1,1]}
];
var gRound=0,gCoef=ROUNDS[0].start.slice(),gDone=false;
function gcd2(a,b){return b?gcd2(b,a%b):a;}
function gcdAll(arr){var g=0;arr.forEach(function(n){g=gcd2(g,n);});return g||1;}
function tallyOf(round,coef){
  var L={},R={},order=[],seen={};
  function add(map,sp,c){Object.keys(sp.atoms).forEach(function(el){if(!seen[el]){seen[el]=1;order.push(el);}map[el]=(map[el]||0)+sp.atoms[el]*c;});}
  round.left.forEach(function(sp,i){add(L,sp,coef[i]);});
  round.right.forEach(function(sp,i){add(R,sp,coef[round.left.length+i]);});
  return {L:L,R:R,order:order};
}
function spHtml(sp,i){
  return '<span class="mc-sp"><span class="mc-pmrow"><button class="mc-pm" data-g="dec" data-i="'+i+'">−</button><span class="mc-coef">'+gCoef[i]+'</span><button class="mc-pm" data-g="inc" data-i="'+i+'">+</button></span><span class="mc-formula">'+sp.f+'</span></span>';
}
function confetti(){
  var host=$("game-confetti");if(!host)return;
  var colors=["#e5484d","#3e63dd","#30a46c","#f5b83d","#9b5de5"];
  var s="";
  for(var i=0;i<36;i++){
    var c=colors[i%colors.length];
    var l=(Math.random()*96).toFixed(1),dl=(Math.random()*0.5).toFixed(2),sz=(6+Math.random()*6).toFixed(0);
    s+='<span class="mc-conf" style="left:'+l+"%;background:"+c+";width:"+sz+"px;height:"+sz+"px;animation-delay:"+dl+'s"></span>';
  }
  host.innerHTML=s;
  setTimeout(function(){host.innerHTML="";},2800);
}
function renderGame(){
  var r=ROUNDS[gRound];
  var t=tallyOf(r,gCoef);
  var eqHtml=r.left.map(function(sp,i){return spHtml(sp,i);}).join('<span class="mc-op">+</span>')
    +'<span class="mc-op mc-arrow">→</span>'
    +r.right.map(function(sp,i){return spHtml(sp,r.left.length+i);}).join('<span class="mc-op">+</span>');
  var allEq=t.order.every(function(el){return (t.L[el]||0)===(t.R[el]||0);});
  var tallyHtml=t.order.map(function(el){
    var l=t.L[el]||0,rr=t.R[el]||0,ok=l===rr;
    return '<span class="mc-tally '+(ok?"ok":"bad")+'">'+(ELNAME[el]||el)+" "+el+"：左 "+l+" · 右 "+rr+" "+(ok?"✓":"✗")+"</span>";
  }).join("");
  var g=gcdAll(gCoef);
  var success=allEq&&g===1;
  if(success&&!gDone){gDone=true;confetti();}
  var html='<div class="mc-ground">'+r.title+'</div><div class="mc-eqrow">'+eqHtml+'</div><div class="mc-tallyrow">'+tallyHtml+"</div>";
  if(success){
    if(gRound===ROUNDS.length-1){
      html+='<div class="mc-success">🎉 全部配平成功！记住：配平 = 让两边每种原子的个数相等，只能改系数，不能改下标。</div>';
    }else{
      html+='<div class="mc-success">🎉 配平成功！</div><div class="mc-nextrow"><button class="fx-btn primary" data-g="next">下一题 →</button></div>';
    }
  }else if(allEq&&g>1){
    html+='<div class="mc-gmsg">两边原子数已经相等了！但系数还能同时除以 '+g+' 约分——配平要<b>最简</b>，试试把每个系数都调小。</div>';
  }else{
    html+='<div class="mc-gmsg">点 +/− 调整系数，让每种原子的左右个数都相等。</div>';
  }
  $("game-body").innerHTML=html;
}
$("game-body").addEventListener("click",function(e){
  var d=e.target&&e.target.dataset;if(!d||!d.g)return;
  if(d.g==="inc"||d.g==="dec"){
    if(gDone)return;
    var i=+d.i;
    gCoef[i]+=d.g==="inc"?1:-1;
    if(gCoef[i]<1)gCoef[i]=1;
    if(gCoef[i]>6)gCoef[i]=6;
    renderGame();
  }else if(d.g==="next"){
    gRound++;gCoef=ROUNDS[gRound].start.slice();gDone=false;
    renderGame();
  }
});

var QUIZ=[

  {q:"2. 蜡烛燃烧后变轻了，这违反质量守恒定律吗？",opts:["违反，质量确实减少了","不违反，生成的二氧化碳和水蒸气逸散到空气中，没有被称到"],ans:1,why:"蜡烛 + 氧气 → 二氧化碳 + 水。气体跑掉了没称到，看起来才变轻；把所有物质都算上，总质量不变。若在密闭容器里称量，就不会变轻。"}

var qState={};
function renderQuiz(){
  $("quiz-body").innerHTML=QUIZ.map(function(item,qi){
    var st=qState[qi];
    var opts=item.opts.map(function(op,oi){
      var cls="quiz-opt";
      if(st!==undefined){if(oi===item.ans)cls+=" right";else if(oi===st)cls+=" wrong";}
      return '<button class="'+cls+'" data-q="'+qi+'" data-o="'+oi+'">'+op+"</button>";
    }).join("");
    var why=st!==undefined
      ? '<div class="quiz-why" style="display:block">'+(st===item.ans?"✓ 答对了！":"✗ 答错了。")+item.why+"</div>"
      : '<div class="quiz-why"></div>';
    return '<div class="quiz-q">'+item.q+'</div><div class="quiz-opts">'+opts+"</div>"+why;
  }).join("");
}
$("quiz-body").addEventListener("click",function(e){
  var d=e.target&&e.target.dataset;if(!d||d.q===undefined)return;
  var qi=+d.q;
  if(qState[qi]!==undefined)return;
  qState[qi]=+d.o;
  renderQuiz();
});

buildTheater();
renderGame();
renderQuiz();
renderStep(0);

var $=function(id){return document.getElementById(id);};
var reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var __step=0,__hold=-1;
function renderStep(i){
  __step=i;
  var btns=document.querySelectorAll(".fx-stepbtn");
  btns.forEach(function(b,j){b.classList.toggle("active",i===j);});
  var s=STEPS[i];
  $("fx-steptext").innerHTML="<b>"+s.t.replace(/^\d+\s*[·、]\s*/,"")+"</b>　"+s.html;
  if(typeof onStep==="function")onStep(i);
}
function holdStep(i){__hold=i;renderStep(i);}
function releaseHold(){__hold=-1;}
document.querySelectorAll(".fx-stepbtn").forEach(function(b){
  b.addEventListener("click",function(){holdStep(+b.dataset.step);});
});
(function initTips(){
  var tip=$("fx-tip"),stage=$("fx-stage");
  if(!tip||!stage||typeof TIPS==="undefined")return;
  function show(id,x,y){
    var t=TIPS[id];if(!t)return;
    tip.innerHTML="<b>"+t[0]+"</b><span>"+t[1]+"</span>";
    tip.style.display="block";
    var r=stage.getBoundingClientRect();
    tip.style.left=Math.min(r.width-250,Math.max(8,x-r.left+14))+"px";
    tip.style.top=Math.max(8,y-r.top-10)+"px";
  }
  document.querySelectorAll(".fx-part").forEach(function(el){
    el.addEventListener("pointerenter",function(e){show(el.dataset.tip,e.clientX,e.clientY);});
    el.addEventListener("pointermove",function(e){show(el.dataset.tip,e.clientX,e.clientY);});
    el.addEventListener("pointerleave",function(){tip.style.display="none";});
    el.addEventListener("click",function(e){show(el.dataset.tip,e.clientX,e.clientY);});
  });
})();
