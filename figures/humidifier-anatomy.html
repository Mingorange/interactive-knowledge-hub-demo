-mark="comf" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>湿度 45%~60% 是舒适区</span></span><span class="iso-caption">超声波加湿器不加热：换能片以每秒约170万次的频率振动，把水打成微米级水滴，风扇再把雾送出。注水别超 MAX 线，尽量用纯净水，水空了要关机防干烧。</span></figcaption></figure>

<div class="quiz" id="quiz"><div class="quiz-title">小测验</div><div id="quiz-body"></div></div></main><script type="module">var STEPS=[{"t":"1 · 认识部件","html":"点一点图上的名字看说明书：<b>水箱</b>装水、<b>换能片</b>（震荡膜片）藏在水箱底部、<b>风扇</b>在底座里、雾从顶部<b>出雾口</b>出去，旁边<b>湿度计</b>盯着房间湿度。这台机器全程<b>不加热</b>——它出的不是「蒸汽」，是冷雾。"},{"t":"2 · 水怎么变成雾","html":"点「⏻ 开机」看水面：换能片以<b>每秒约 170 万次</b>的超声波频率振动，把表面的水「打碎」成 <b>1~5 微米</b>的小水滴——这就是雾。⚠️ 看得见的白雾是<b>小水滴</b>；真正的水蒸气是气体，<b>看不见</b>。"},{"t":"3 · 雾怎么出去","html":"光有雾还不够：底座里的<b>风扇</b>转动，把雾从出雾口<b>吹送</b>到房间里。切换<b>风速</b>试试——风越大，雾飘得越远、湿度涨得越快，水也用得越快（盯着水位看）。"},{"t":"4 · 房间湿度变化","html":"盯着湿度计：开机后读数从 <b>35%</b> 一路爬升。人体最舒服的相对湿度是 <b>45%~60%</b>（表盘上的绿色弧段），到了就该关小或关机——<b>太潮</b>同样不好：容易滋生霉菌、被子发黏。"},{"t":"5 · 避坑与保养","html":"三个大坑：① 注水<b>别超过 MAX 线</b>——我刚帮你加满试试，看到底座漏水了吧？② 尽量用<b>纯净水</b>：自来水里的矿物质会变成白色粉末飘出来（「白粉」），还结水垢；③ 水箱<b>没水要关机</b>，换能片干烧会烧坏——本页水用完会自动停机保护。"}];
var TIPS={"outlet":["出雾口","雾从这里被风扇送出来。出雾口别对着木家具和电器直吹，凝结的水珠会把它们泡坏。"],"tank":["水箱","装水的地方，侧面的红虚线是 MAX 最高水位线。加水别超过它，不然水会从漫水口溢出来漏到桌面上。"],"membrane":["换能片（震荡膜片）","加湿器的心脏：一片压电陶瓷，通电后以每秒约170万次的频率振动，把水打成微米级小水滴。用久了表面结水垢，出雾量会变小，要定期擦洗。"],"fan":["风扇","藏在底座里，负责把水箱里生成的雾吹送出出雾口。风速越大，雾送得越远、加湿越快，耗水也越快。"],"power":["电源开关","点下面的「⏻ 开机」按钮控制它。指示灯亮绿 = 正在工作；水箱没水时机器会自动停机，保护换能片不被干烧。"],"hygro":["湿度计","显示房间的相对湿度。指针下面的数字和指针是同一个「大脑」在算：开机加湿就涨，关机就慢慢回落。绿色弧段 45%~60% 是舒适区。"],"purewater":["纯净水","给加湿器喝的水首选纯净水或蒸馏水。自来水含钙镁等矿物质，会被打成白色粉末飘满屋（白粉），还会让换能片结垢。"]};
var $=function(id){return document.getElementById(id);};
var reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

var OUTX=329.5,OUTY=178.8;
var WBLX=270.1,WBLY=237.7,WBRX=367.3,WBRY=286.3;
var WSL0X=270.1,WSL0Y=237.7,WSL1X=270.1,WSL1Y=189.7;
var WSR0X=367.3,WSR0Y=286.3,WSR1X=367.3,WSR1Y=238.3;
var WC0X=318.7,WC0Y=262,WC1Y=214;
var HGX=445.6,HGY=281.2;
var power=false,water=0.7,fan=2,hum=35,viewCut=true,leak=false,dryWarned=false;
var roEl=document.querySelector("[data-readout]");
function msg(t){$("fx-msg").textContent=t;}
function producing(){return power&&water>0;}
function renderWater(){
  var f=water;
  var slx=WSL0X+(WSL1X-WSL0X)*f,sly=WSL0Y+(WSL1Y-WSL0Y)*f;
  var srx=WSR0X+(WSR1X-WSR0X)*f,sry=WSR0Y+(WSR1Y-WSR0Y)*f;
  $("hu-water").setAttribute("points",WBLX+","+WBLY+" "+WBRX+","+WBRY+" "+srx.toFixed(1)+","+sry.toFixed(1)+" "+slx.toFixed(1)+","+sly.toFixed(1));
  var top=$("hu-watertop");
  top.setAttribute("cy",(WC0Y+(WC1Y-WC0Y)*f).toFixed(1));
  top.setAttribute("opacity",f>0.02?"1":"0");
  $("hu-waterpct").textContent=Math.round(f*100)+"%";
  var sl=$("hu-waterslider");
  if(document.activeElement!==sl)sl.value=Math.round(f*100);
}
function renderHum(){
  var hv=Math.round(hum);
  $("hu-humnum").textContent=hv+"%";
  var deg=-120+(hum-20)/70*240;
  $("hu-needle").setAttribute("transform","rotate("+deg.toFixed(1)+" "+HGX+" "+HGY+")");
}
function renderState(){
  $("hu-led").setAttribute("fill",power?"#30a46c":"#c3cbd1");
  $("btn-power").textContent=power?"⏻ 关机":"⏻ 开机";
  var fb=$("hu-fanblades");
  fb.style.animationPlayState=producing()?"running":"paused";
  fb.style.animationDuration=(1.35/fan)+"s";
  document.querySelectorAll(".hu-ripple").forEach(function(r){r.classList.toggle("on",producing());});
  $("hu-leak").setAttribute("opacity",leak?"1":"0");
  var st=power?(water>0?"工作中":"没水停机"):"待机";
  var line=st+" · 湿度 "+Math.round(hum)+"% · 水量 "+Math.round(water*100)+"% · 风速 "+(fan===1?"低":fan===2?"中":"高");
  $("fx-readline").textContent=line;
  if(roEl)roEl.textContent="湿度 "+Math.round(hum)+"%";
}
function setPower(on){
  if(on&&water<=0){msg("⚠️ 水箱是空的，先注水再开机——换能片没水干烧会烧坏！");return;}
  power=on;dryWarned=false;
  msg(on?"开机！换能片高频震荡，水面冒起白雾，风扇把雾送出出雾口。":"已关机。雾慢慢散去，湿度会一点点回落。");
  renderState();
}
$("btn-power").addEventListener("click",function(){setPower(!power);});
$("btn-view").addEventListener("click",function(){
  viewCut=!viewCut;
  var sh=$("hu-shell");
  if(viewCut){sh.setAttribute("fill","rgba(150,195,235,.12)");sh.setAttribute("fill-opacity","0.12");$("hu-water-g").setAttribute("opacity","1");$("hu-membrane-g").setAttribute("opacity","1");$("btn-view").textContent="👁 外观模式";msg("剖视模式：看得见水箱里的水、换能片和 MAX 水位线。");}
  else{sh.setAttribute("fill","#dfe9f2");sh.setAttribute("fill-opacity","0.97");$("hu-water-g").setAttribute("opacity","0");$("hu-membrane-g").setAttribute("opacity","0");$("btn-view").textContent="🔪 剖视模式";msg("外观模式：这就是它摆在桌上的样子——内部机关全藏起来了。切回剖视模式看它怎么工作。");}
  renderState();
});
$("hu-waterslider").addEventListener("input",function(){
  water=+$("hu-waterslider").value/100;
  if(water>0.95&&!leak){leak=true;msg("⚠️ 水加太满了！超过 MAX 最高水位线，水从漫水口溢出来——底座都漏水了。加到 MAX 线以下就好。");}
  else if(water<=0.95&&leak){leak=false;msg("水位回到 MAX 线以下，不漏了。记住：注水别贪多。");}
  renderWater();renderState();
});
document.querySelectorAll(".hu-fanbtn").forEach(function(b){
  b.addEventListener("click",function(){
    fan=+b.dataset.fan;
    document.querySelectorAll(".hu-fanbtn").forEach(function(x){x.classList.toggle("active",x===b);});
    msg("风速调到「"+(fan===1?"低":fan===2?"中":"高")+"」："+(fan===3?"雾喷得最远，湿度涨得最快，耗水也最快。":fan===1?"雾柔和省水，湿度慢慢涨。":"中档，速度和耗水都适中。"));
    renderState();
  });
});
function doReset(){
  power=false;water=0.7;fan=2;hum=35;leak=false;dryWarned=false;
  if(!viewCut)$("btn-view").click();
  document.querySelectorAll(".hu-fanbtn").forEach(function(x){x.classList.toggle("active",+x.dataset.fan===2);});
  $("hu-waterslider").value=70;
  renderWater();renderHum();renderState();
  msg("已重置。点「⏻ 开机」，或按步骤 1–5 往下走。");
}
$("btn-reset").addEventListener("click",doReset);
// 雾气粒子
var mists=[];
(function(){
  var ns="http://www.w3.org/2000/svg",g=$("hu-mist"),i,c;
  for(i=0;i<26;i++){
    c=document.createElementNS(ns,"circle");
    c.setAttribute("fill","rgba(190,220,248,.75)");c.setAttribute("stroke","none");c.setAttribute("opacity","0");
    g.appendChild(c);
    mists.push({el:c,age:Math.random(),life:2.2+Math.random()*1.6,drift:(Math.random()-0.3),r0:2.5+Math.random()*3});
  }
})();
var raf=null,lastTs=0;
function frame(ts){
  var dt=Math.min(0.05,lastTs?(ts-lastTs)/1000:0.016);lastTs=ts;
  var speed=reduceMotion?4:1,i,m;
  var prod=producing();
  if(prod){
    water=Math.max(0,water-dt*0.0055*fan*speed);
    if(water<=0&&!dryWarned){
      dryWarned=true;power=false;
      msg("⚠️ 水箱空了！换能片没水干烧会损坏——已自动停机。注水后才能再开机。");
    }
    var target=34+fan*12;
    hum+=(target-hum)*Math.min(1,dt*0.10*speed);
    renderWater();
  }else{
    hum+=(35-hum)*Math.min(1,dt*0.03*speed);
  }
  renderHum();renderState();
  for(i=0;i<mists.length;i++){
    m=mists[i];
    m.age+=dt*(prod?1:0.55)*speed;
    if(m.age>m.life){m.age=0;m.life=2.2+Math.random()*1.6;m.drift=(Math.random()-0.3);}
    var k=m.age/m.life;
    if(!prod&&power===false&&k>0.98){m.el.setAttribute("opacity","0");continue;}
    var rise=k*(46+fan*10),spread=k*k*(30+fan*16)*0.9+m.drift*k*22;
    var x=OUTX+spread,y=OUTY-rise+Math.sin(k*5+i)*2.2;
    var r=m.r0+k*10;
    var op=prod?Math.sin(Math.min(1,k)*Math.PI)*0.75:(power?Math.sin(Math.min(1,k)*Math.PI)*0.3:Math.max(0,0.5-k)*0.4);
    m.el.setAttribute("cx",x.toFixed(1));m.el.setAttribute("cy",y.toFixed(1));
    m.el.setAttribute("r",r.toFixed(1));m.el.setAttribute("opacity",op.toFixed(2));
  }
  raf=requestAnimationFrame(frame);
}
function startLoop(){if(!raf)raf=requestAnimationFrame(frame);}
function stopLoop(){if(raf){cancelAnimationFrame(raf);raf=null;lastTs=0;}}
if(window.IntersectionObserver&&$("fx-stage")){
  new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)startLoop();else stopLoop();});},{threshold:0.05}).observe($("fx-stage"));
} else { startLoop(); }
function onStep(i){
  if(i===1||i===2||i===3){if(!power&&water>0)setPower(true);}
  if(i===4){
    if(!power&&water>0)setPower(true);
    var sl=$("hu-waterslider");sl.value=100;sl.dispatchEvent(new Event("input"));
    msg("⚠️ 这是演示翻车：水加到 100% 超过 MAX 线——底座漏水了！把注水量滑杆拉回 95% 以下就不漏。");
  }
}
document.addEventListener("keydown",function(e){
  if(e.key>="1"&&e.key<="5")holdStep(+e.key-1);
  else if(e.key==="r"||e.key==="R")doReset();
});
var QUIZ=[
  {q:"1. 超声波加湿器喷出的「雾」是怎么来的？",opts:["把水加热烧开变成水蒸气","换能片高频振动，把水打碎成微米级小水滴","用风扇把水吹成水花"],ans:1,why:"超声波加湿器不加热：换能片每秒振动约170万次，把水打成 1~5 微米的小水滴飘出来。看得见的白雾是小水滴，真正的水蒸气是看不见的气态水。"},
  {q:"2. 给加湿器注水、用水，下面哪条是对的？",opts:["水加得越满越好，省得老加水","注水不超过 MAX 最高水位线，尽量用纯净水","必须加自来水，矿物质对身体好"],ans:1,why:"超 MAX 线会从漫水口漏水；自来水的矿物质会被打成「白粉」飘散、还让换能片结垢，所以尽量用纯净水，水没了要及时关机防干烧。"}
];
(function buildQuiz(){
  var host=$("quiz-body");if(!host)return;
  QUIZ.forEach(function(item){
    var d=document.createElement("div");
    d.innerHTML='<div class="quiz-q">'+item.q+'</div><div class="quiz-opts"></div><div class="quiz-why"></div>';
    var opts=d.querySelector(".quiz-opts"),why=d.querySelector(".quiz-why"),done=false;
    item.opts.forEach(function(op,oi){
      var b=document.createElement("button");b.className="quiz-opt";b.textContent=op;
      b.addEventListener("click",function(){
        if(done)return;done=true;
        b.classList.add(oi===item.ans?"right":"wrong");
        if(oi!==item.ans)opts.children[item.ans].classList.add("right");
        why.textContent=(oi===item.ans?"\u2713 答对了！":"\u2717 答错了。")+item.why;why.style.display="block";
      });
      opts.appendChild(b);
    });
    host.appendChild(d);
  });
})();
renderWater();renderHum();renderState();
renderStep(0);

var $=function(id){return document.getElementById(id);};
var reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var __step=0,__hold=-1;
function renderStep(i){
  __step=i;
  var btns=document.querySelectorAll(".fx-stepbtn");
  btns.forEach(function(b,j){b.classList.toggle("active",i===j);});
  var s=STEPS[i];
  $("fx-steptext").innerHTML="<b>"+s.t.replace(/^\d+\s*[·、]\s*/,"")+"</b>　"+s.html;
  if(typeof onStep==="function")onStep(i);
}
function holdStep(i){__hold=i;renderStep(i);}
function releaseHold(){__hold=-1;}
document.querySelectorAll(".fx-stepbtn").forEach(function(b){
  b.addEventListener("click",function(){holdStep(+b.dataset.step);});
});
(function initTips(){
  var tip=$("fx-tip"),stage=$("fx-stage");
  if(!tip||!stage||typeof TIPS==="undefined")return;
  function show(id,x,y){
    var t=TIPS[id];if(!t)return;
    tip.innerHTML="<b>"+t[0]+"</b><span>"+t[1]+"</span>";
    tip.style.display="block";
    var r=stage.getBoundingClientRect();
    tip.style.left=Math.min(r.width-250,Math.max(8,x-r.left+14))+"px";
    tip.style.top=Math.max(8,y-r.top-10)+"px";
  }
  document.querySelectorAll(".fx-part").forEach(function(el){
    el.addEventListener("pointerenter",function(e){show(el.dataset.tip,e.clientX,e.clientY);});
    el.addEventListener("pointermove",function(e){show(el.dataset.tip,e.clientX,e.clientY);});
    el.addEventListener("pointerleave",function(){tip.style.display="none";});
    el.addEventListener("click",function(e){show(el.dataset.tip,e.clientX,e.clientY);});
  });
})();
</script></body></html>
