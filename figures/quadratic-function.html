<div class="qd-msg" id="qd-msg"></div></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {

 { t: "3 · 平移的秘密",
   setup: function(){ if(Math.abs(state.a) < 0.05){ state.a = -1; state.b = 0; state.c = 4; } render(); },
   html: "<b>配方就是搬家。</b>y = ax²+bx+c 配成 <b>y = a(x−h)²+k</b>，(h,k) 就是顶点。拖 <b>h</b> 左右走、拖 <b>k</b> 上下走——抛物线形状一点不变，整体平滑滑动。PDF 画不出这个过程，亲手拖一次就记住。" },
 { t: "4 · 对称轴与顶点",
   setup: function(){ applyABC(-1, 0, 4); },
   html: "<b>拖 b，看顶点“散步”。</b>顶点 (−b/2a, f(−b/2a))，对称轴 x = −b/2a。b 变化时，顶点沿着<b>虚线轨迹</b>滑动——b 只管左右偏，不管形状。" },
 { t: "5 · Δ 与落水点",
   setup: function(){ state.a = -1; state.b = 0; state.c = 4; render(); },
   html: "<b>Δ = b²−4ac 决定落水点个数。</b>拖滑杆让 c 从 4 降到 −0.5：Δ 从正→零→负，两个落水点<b>逐渐靠近 → 在水面重合 → 消失</b>。落水点就是方程 ax²+bx+c=0 的解。c&lt;0 时喷口没入水面——数学上抛物线整体在水面之下。" },
 { t: "6 · 打靶挑战",
   setup: function(){ newTarget(true); },
   html: "<b>打靶！</b>水面上有个红色靶心。调 a/b/c，让右侧水柱正中靶心——偏差小于 0.35 判命中。提示：先调 c 定高低，再调 b 微调落点。" },
 { t: "7 · 一句话总结",
   setup: function(){ applyABC(-1, 0, 4); },
   html: "<b>三句话收束：</b><br>① <b>a</b> 定开口方向和宽窄（水压）；<br>② <b>h、k</b> 定位置——配方就是搬家，顶点是 (h,k)；<br>③ <b>Δ</b> 定落水点个数：Δ&gt;0 两个，Δ=0 一个，Δ&lt;0 没有。<br>一般式管计算，顶点式看图像——同一条抛物线，两种讲法。" }
];

function buildPanel(){
  var p = document.getElementById("qd-panel"), html = "";
  if(state.step === 0){
    html = '<p class="qd-exp" style="text-align:center">把鼠标移到（手指点按）喷口、顶点、落水点、对称轴、水面上看说明 · 空格暂停水流</p>';
  } else if(state.step === 1){
    html = srow("a", "a", -2.5, 2.5, 0.1, state.a, "水压 —— |a| 越大水柱越窄；a&gt;0 开口向上，a&lt;0 开口向下；穿过 0 时翻转");
  } else if(state.step === 2){
    var hk = getHK() || { h: 0, k: state.c };
    html = srow("h", "h", -5, 5, 0.1, hk.h, "左右平移 —— 拖 h，抛物线整体左右滑动，形状不变") +
           srow("k", "k", -1, 7, 0.1, hk.k, "上下平移 —— 拖 k，抛物线整体上下滑动，形状不变") +
           srow("a", "a", -2.5, 2.5, 0.1, state.a, "a 决定宽窄和开口方向");
  } else if(state.step === 3){
    html = srow("b", "b", -5, 5, 0.1, state.b, "偏向 —— 拖 b，看顶点沿着虚线轨迹“散步”") +
           srow("a", "a", -2.5, 2.5, 0.1, state.a, "") +
           srow("c", "c", 0, 6, 0.1, state.c, "");
  } else if(state.step === 4){
    html = '<div class="qd-delta">Δ = <b id="qd-deltanum">–</b><br><span class="qd-sub" id="qd-deltacount">–</span></div>' +
           srow("d", "Δ 演示", 0, 100, 1, deltaVal(), "拖动：c 从 4 → −0.5，看 Δ 穿过 0（a=−1，b=0 固定）");
  } else if(state.step === 5){
    html = '<div class="qd-targetmsg" id="qd-targetmsg"></div>' +
           srow("a", "a", -2.5, -0.3, 0.1, state.a, "") +
           srow("b", "b", -5, 5, 0.1, state.b, "") +
           srow("c", "c", 0, 6, 0.1, state.c, "") +
           '<div style="text-align:center;margin:4px 0"><button class="qd-ghostbtn" id="b-newtarget">🎯 换个靶位</button></div>';
  } else if(state.step === 6){
    html = '<div style="text-align:center;margin:8px 0"><button class="qd-ghostbtn" id="b-again">↺ 再打一次靶</button></div>';
  }
  p.innerHTML = html;
  if(state.step === 1) bindRange("a", function(v){ state.a = v; syncABC(); render(); });
  else if(state.step === 2){ bindRange("h", setH); bindRange("k", setK); bindRange("a", function(v){ state.a = v; syncABC(); render(); }); }
  else if(state.step === 3){
    bindRange("b", function(v){ state.b = v; syncABC(); render(); });
    bindRange("a", function(v){ state.a = v; syncABC(); render(); });
    bindRange("c", function(v){ state.c = v; syncABC(); render(); });
  }
  else if(state.step === 4) bindRange("d", function(v){ state.c = 4 - 4.5 * v / 100; syncABC(); render(); });
  else if(state.step === 5){
    bindRange("a", function(v){ state.a = v; syncABC(); render(); });
    bindRange("b", function(v){ state.b = v; syncABC(); render(); });
    bindRange("c", function(v){ state.c = v; syncABC(); render(); });
    var bn = document.getElementById("b-newtarget");
    if(bn) bn.addEventListener("click", function(){ newTarget(true); });
  }
  else if(state.step === 6){
    var ag = document.getElementById("b-again");
    if(ag) ag.addEventListener("click", function(){ setStep(5); });
  }
}

function setStep(i){
  state.step = i;
  var btns = document.querySelectorAll(".qd-stepbtn");
  for(var j = 0; j < btns.length; j++) btns[j].classList.toggle("active", j === i);
  var st = STEPS[i];
  document.getElementById("qd-steptext").innerHTML = "<b>" + st.t.slice(4) + "</b>　" + st.html.replace(/^<b>[^<]*<\/b>/, "");
  st.setup();
  buildPanel();
  render();
}

/* ---- target game (step 6) ---- */
function drawTarget(){
  targetG.innerHTML = "";
  if(state.step !== 5){ hide(targetG); return; }
  var p = pr(state.targetX, 0);
  function mk(tag, attrs){ var e = document.createElementNS(NS, tag); for(var k in attrs) e.setAttribute(k, attrs[k]); return e; }
  targetG.appendChild(mk("ellipse", { cx: p[0].toFixed(1), cy: p[1].toFixed(1), rx: 15, ry: 6, fill: "none", stroke: "#e5484d", "stroke-width": 2.5 }));
  targetG.appendChild(mk("ellipse", { cx: p[0].toFixed(1), cy: p[1].toFixed(1), rx: 7, ry: 2.8, fill: "none", stroke: "#e5484d", "stroke-width": 1.4, opacity: 0.65 }));
  targetG.appendChild(mk("circle", { cx: p[0].toFixed(1), cy: p[1].toFixed(1), r: 2.2, fill: "#e5484d" }));
  var t = mk("text", { x: p[0].toFixed(1), y: (p[1] - 12).toFixed(1), "text-anchor": "middle", fill: "#e5484d", "font-size": 12 });
  t.textContent = "靶心 x=" + fmt(state.targetX); targetG.appendChild(t);
  show(targetG);
}
function scoreTarget(){
  var box = document.getElementById("qd-targetmsg");
  if(!box) return;
  var m = model(state.a, state.b, state.c);
  if(m.deg || state.a >= 0 || m.roots.length === 0){
    box.textContent = "水柱没有落在水面上——调回 a<0 且 Δ>0 试试"; return;
  }
  var r = Math.max.apply(null, m.roots);
  var d = Math.abs(r - state.targetX);
  if(d < 0.35) box.innerHTML = "🎯 <b>命中！</b>右侧落点 x=" + fmt(r) + "，偏差 " + d.toFixed(2);
  else box.textContent = "右侧落点 x=" + fmt(r) + "，偏靶心 " + d.toFixed(2) + " —— 再调调 a/b/c";
}
function newTarget(resetABC){
  state.targetX = Math.round((1.5 + Math.random() * 3) * 10) / 10;
  if(resetABC) applyABC(-1, 0, 4); else { drawTarget(); scoreTarget(); }
}

/* ---- Δ readout (step 5) ---- */
function updateDeltaBox(m){
  var n = document.getElementById("qd-deltanum"), c2 = document.getElementById("qd-deltacount");
  if(!n || !c2) return;
  n.textContent = fmt(m.disc);
  var s = m.roots.length;
  c2.textContent = s === 2 ? "落水点 2 个" : (s === 1 ? "相切 · 落水点 1 个" : "无落水点");
  var col = m.disc > 0.05 ? "#30a46c" : (m.disc < -0.05 ? "#e5484d" : "#b7791f");
  n.style.color = col; c2.style.color = col;
}

/* ---- main render ---- */
function render(){
  var a = state.a, b = state.b, c = state.c, m = model(a, b, c), d, i, x;
  if(m.deg){ d = "M" + P2(PX0, fq(a, b, c, PX0)) + " L" + P2(PX1, fq(a, b, c, PX1)); }
  else { var pts = []; for(x = PX0; x <= PX1 + 0.001; x += 0.12){ pts.push(P2(x, fq(a, b, c, x))); } d = "M" + pts.join(" L"); }
  curve.setAttribute("d", d); curveU.setAttribute("d", d);
  nozzleG.innerHTML = nozzleHTML(c);
  var pc = pr(0, c);
  nozzleHit.setAttribute("cx", pc[0].toFixed(1)); nozzleHit.setAttribute("cy", pc[1].toFixed(1));
  cL.setAttribute("x", (pc[0] + 12).toFixed(1)); cL.setAttribute("y", (pc[1] - 10).toFixed(1));
  cL.textContent = "c=" + fmt(c) + " 喷口高度"; show(cL);
  if(!m.deg && m.vx >= PX0 && m.vx <= PX1 && m.vy >= 0 && m.vy <= PY1){
    var pv = pr(m.vx, m.vy);
    vtx.setAttribute("cx", pv[0].toFixed(1)); vtx.setAttribute("cy", pv[1].toFixed(1)); show(vtx);
    var nearNoz = Math.abs(m.vx) < 1.5 && Math.abs(m.vy - c) < 1.5;
    vtxL.setAttribute("x", (pv[0] + (nearNoz ? -10 : 10)).toFixed(1)); vtxL.setAttribute("y", (pv[1] - 12).toFixed(1));
    vtxL.setAttribute("text-anchor", nearNoz ? "end" : "start");
    vtxL.textContent = "顶点 (" + fmt(m.vx) + ", " + fmt(m.vy) + ")"; show(vtxL);
    var pa = pr(m.vx, 0), pb = pr(m.vx, m.vy);
    axisP.setAttribute("d", "M" + pa[0].toFixed(1) + "," + pa[1].toFixed(1) + " L" + pb[0].toFixed(1) + "," + pb[1].toFixed(1));
    show(axisP);
  } else { hide(vtx); hide(vtxL); hide(axisP); }
  var dots = [[r1, rl1], [r2, rl2]], shown = 0;
  for(i = 0; i < 2; i++){
    if(!m.deg && i < m.roots.length && m.roots[i] >= PX0 && m.roots[i] <= PX1){
      var q = pr(m.roots[i], 0);
      dots[i][0].setAttribute("cx", q[0].toFixed(1)); dots[i][0].setAttribute("cy", q[1].toFixed(1)); show(dots[i][0]);
      dots[i][1].setAttribute("x", q[0].toFixed(1)); dots[i][1].setAttribute("y", (q[1] + 20).toFixed(1));
      dots[i][1].setAttribute("text-anchor", "middle");
      dots[i][1].textContent = "(" + fmt(m.roots[i]) + ", 0)"; show(dots[i][1]);
      shown++;
    } else { hide(dots[i][0]); hide(dots[i][1]); }
  }
  if(state.step === 3 && !m.deg){
    var lp = []; for(x = PX0; x <= PX1 + 0.001; x += 0.5){ lp.push(P2(x, c - a * x * x)); }
    locus.setAttribute("d", "M" + lp.join(" L")); show(locus);
  } else hide(locus);
  if(state.step === 5){ drawTarget(); scoreTarget(); } else hide(targetG);
  var eq = document.getElementById("qd-eq"), eqt = "";
  if(state.step === 2){ var hk0 = getHK(); eqt = hk0 ? ("y = " + fmt(a) + "(x−" + fmt(hk0.h) + ")²+" + fmt(hk0.k)) : "y = ax²+bx+c（a≈0，不是抛物线）"; }
  else if(state.step === 4){ eqt = "Δ = b²−4ac = " + fmt(m.disc); }
  if(eq){ eq.textContent = eqt; eq.style.display = eqt ? "" : "none"; }
  if(state.step === 4) updateDeltaBox(m);
  var info, t;
  if(m.deg){ info = "退化为直线 · a=0 时不再是抛物线"; }
  else { info = "顶点 (" + fmt(m.vx) + ", " + fmt(m.vy) + ") · Δ=" + fmt(m.disc) + " · 落水点 " + shown + " 个 · " + (a > 0 ? "开口向上" : "开口向下"); }
  if(state.step === 2 && !m.deg){ var hk2 = getHK(); t = "y=" + fmt(a) + "(x−" + fmt(hk2.h) + ")²+" + fmt(hk2.k); }
  else if(state.step === 4){ t = "Δ=" + fmt(m.disc) + " · 落水点 " + shown + " 个"; }
  else { t = "a=" + fmt(a) + " · b=" + fmt(b) + " · c=" + fmt(c); }
  readout.textContent = t;
  el("qd-readline").textContent = info;
  syncABC();
  if(state.step === 2){
    var hk3 = getHK();
    if(hk3){
      var sh = document.getElementById("s-h"), sk = document.getElementById("s-k");
      if(sh && document.activeElement !== sh) sh.value = hk3.h;
      if(sk && document.activeElement !== sk) sk.value = hk3.k;
      setValSpan("h", hk3.h); setValSpan("k", hk3.k);
    }
  }
  if(m.deg){ msg.textContent = "a=0：图像退化为直线，不再是抛物线"; }
  else if(msg.textContent) msg.textContent = "";
  if(still.matches) paintDrops(false, 0);
}

/* ---- animation loop ---- */
var prev = 0, frame = 0, visible = false;
function tick(now){
  var dt = prev ? Math.min((now - prev) / 1000, 1 / 20) : 1 / 60;
  prev = now;
  paintDrops(true, dt);
  frame = 0;
  if(visible && !still.matches && state.playing) frame = requestAnimationFrame(tick);
}
function loopStart(){
  if(!frame && visible && !still.matches && state.playing){ prev = 0; frame = requestAnimationFrame(tick); }
}
function setPlaying(p){
  state.playing = p;
  el("b-play").textContent = p ? "暂停水流" : "播放水流";
  if(!p){ for(var i = 0; i < drops.length; i++) drops[i].el.setAttribute("opacity", "0"); }
  loopStart();
}
el("b-play").addEventListener("click", function(){ setPlaying(!state.playing); });
el("b-reset").addEventListener("click", function(){ setStep(state.step); });

/* ---- tooltips ---- */
svg.addEventListener("pointermove", function(e){
  var g = e.target.closest ? e.target.closest("[data-tip]") : null;
  var key = g ? g.getAttribute("data-tip") : null;
  var info = key ? TIP[key] : null;
  if(!info){ tip.style.display = "none"; return; }
  tip.innerHTML = "<b>" + info[0] + "</b><span>" + info[1] + "</span>";
  tip.style.display = "block";
  var r = stage.getBoundingClientRect();
  var lx = e.clientX - r.left + 16, ly = e.clientY - r.top + 12;
  if(lx > r.width - 240) lx = r.width - 240;
  tip.style.left = lx + "px"; tip.style.top = ly + "px";
});
svg.addEventListener("pointerleave", function(){ tip.style.display = "none"; });

/* ---- keyboard ---- */
stage.addEventListener("keydown", function(e){
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key >= "1" && e.key <= "7"){ setStep(Number(e.key) - 1); }
  else if(e.key === "r" || e.key === "R"){ setStep(state.step); }
  else if(e.key === " "){ e.preventDefault(); setPlaying(!state.playing); }
});

new IntersectionObserver(function(es){ visible = es[es.length - 1].isIntersecting; loopStart(); }, { rootMargin: "120px 0px" }).observe(stage);

setStep(0);
loopStart();

</script></body></html>
