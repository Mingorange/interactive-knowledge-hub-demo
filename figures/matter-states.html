<div id="quiz-body"></div></main><script type="module">var STEPS=[{"t":"1 · 三态认识","html":"先看<b>粒子放大窗</b>：冰的粒子排成整齐的点阵、只在原地振动；水的粒子到处流动；水蒸气的粒子四散飞奔。看懂三张「粒子快照」，再动手玩温度。"},{"t":"2 · 给冰加热","html":"从 -20°C 点<b>加热</b>：温度计红柱上升，点阵里的粒子振动越来越剧烈，但还排在原位。这段热量让<b>温度升高</b>了。"},{"t":"3 · 熔化（0°C 停住！）","html":"温度卡在 <b>0°C</b> 不动！点阵被「拆开」，粒子开始流动。热量没让温度升高——全拿去拆点阵了。这就是<b>熔化吸热</b>，冰水混合物恒为 0°C。"},{"t":"4 · 给水加热","html":"0°C 的水继续加热：液态粒子越跑越快，温度一路升到 <b>100°C</b>。这段热量又让温度升高了。"},{"t":"5 · 沸腾与可逆","html":"<b>100°C</b> 又停住了！大量气泡冒出，粒子四散成气——热量去「拆散」粒子了（<b>汽化吸热</b>）。点<b>冷却</b>倒放：蒸气→水（液化）→冰（凝固），全程放热。"}];

// ===== Fig 3 · 物态变化：温度-热量-粒子联动模型 =====
var T=-20, meltP=0, boilP=0, totalQ=0, dir=0, tNow=0, lastTs=null;
var CICE=2.1, CW=4.18, LF=334, LV=2257, DQ=6; // kJ/(帧@60fps)
var LQKA=-1.6359999999999997, LQKB=263.56, LQX0=280.5, LQX1=352.6;
var TH_A=-0.7091666666666666, TH_YB=254.5, TH_TOPZ=56;
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function addHeat(dQ){
  totalQ+=dQ;
  var q=Math.abs(dQ);
  if(dQ>0){
    while(q>1e-9){
      if(T<0){var n1=(0-T)*CICE;if(q>=n1){q-=n1;T=0;}else{T+=q/CICE;q=0;}}
      else if(T===0&&meltP<1){var n2=(1-meltP)*LF;if(q>=n2){q-=n2;meltP=1;}else{meltP+=q/LF;q=0;}}
      else if(T<100&&meltP>=1){var n3=(100-T)*CW;if(q>=n3){q-=n3;T=100;}else{T+=q/CW;q=0;}}
      else if(T===100&&boilP<1){var n4=(1-boilP)*LV;if(q>=n4){q-=n4;boilP=1;dir=0;}else{boilP+=q/LV;q=0;}}
      else{dir=0;q=0;}
    }
  }else{
    while(q>1e-9){
      if(T===100&&boilP>0){var g1=boilP*LV;if(q>=g1){q-=g1;boilP=0;}else{boilP-=q/LV;q=0;}}
      else if(T>0){var n5=T*CW;if(q>=n5){q-=n5;T=0;}else{T-=q/CW;q=0;}}
      else if(T===0&&meltP>0){var g2=meltP*LF;if(q>=g2){q-=g2;meltP=0;}else{meltP-=q/LF;q=0;}}
      else if(T>-20){var n6=(T+20)*CICE;if(q>=n6){q-=n6;T=-20;dir=0;}else{T-=q/CICE;q=0;}}
      else{dir=0;q=0;}
    }
  }
}
function phase(){
  if(T<0)return"固态 · 冰";
  if(T===0&&meltP<1)return"熔化中 · 温度不变";
  if(T===0&&meltP===1)return"冰水混合物 · 0°C";
  if(T<100)return"液态 · 水";
  if(boilP<1)return"沸腾中 · 温度不变";
  return"气态 · 水蒸气";
}
function pparams(){
  if(T<0)return{amp:3+(T+20)*0.12,spd:0.6,col:"#5b9bd5",op:1,lab:"固态 · 粒子排成点阵，只在原地振动"};
  if(T===0&&meltP<1)return{amp:5.4+50*meltP,spd:0.6+0.5*meltP,col:"#4a90d9",op:1,lab:"熔化中 · 点阵被拆开，粒子开始流动"};
  if(T<100)return{amp:55+(T/100)*15,spd:1+T/100*0.6,col:"#2f7fd0",op:1,lab:"液态 · 粒子到处流动，温度越高跑得越快"};
  if(boilP<1)return{amp:70+40*boilP,spd:1.6+0.9*boilP,col:"#7ab8ec",op:0.9,lab:"沸腾中 · 大量粒子挣脱液体，四散成气"};
  return{amp:115,spd:2.5,col:"#a8d0f0",op:0.75,lab:"气态 · 粒子四散飞奔，充满整个空间"};
}
// 粒子
var P_N=36, parts=[];
(function initParts(){
  var g=document.getElementById("ms-particles");
  for(var i=0;i<P_N;i++){
    var c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    var gx=60+(i%6)*48, gy=55+Math.floor(i/6)*25;
    var p={el:c,gx:gx,gy:gy,phx:Math.random()*6.28,phy:Math.random()*6.28,w:0.8+Math.random()*0.4};
    c.setAttribute("r","5");
    g.appendChild(c);
    parts.push(p);
  }
})();
// 气泡 / 蒸汽
var bubbles=[], steams=[];
(function initFx(){
  var bg=document.getElementById("ms-bubbles"), sg=document.getElementById("ms-steam");
  var NS="http://www.w3.org/2000/svg";
  for(var i=0;i<8;i++){var c=document.createElementNS(NS,"circle");c.setAttribute("r",String(3+(i%3)));c.setAttribute("fill","rgba(255,255,255,.85)");c.setAttribute("stroke","#7fb3e8");c.setAttribute("stroke-width","1");c.style.display="none";bg.appendChild(c);bubbles.push(c);}
  for(var j=0;j<6;j++){var s=document.createElementNS(NS,"circle");s.setAttribute("r",String(4+(j%3)*2));s.setAttribute("fill","rgba(200,220,240,.5)");s.style.display="none";sg.appendChild(s);steams.push(s);}
})();
var BX0=292.5, BX1=340.6;
var BYB=247.2, BYT=168.7;
var SXX=316.6, SYY=149;
function updateAll(t){
  tNow=t;
  var pp=pparams(), k=pp.amp/115;
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    var wx=180+pp.amp*Math.sin(p.w*pp.spd*t+p.phx);
    var wy=117+pp.amp*0.8*Math.sin(p.w*pp.spd*1.13*t+p.phy);
    var x=p.gx*(1-k)+wx*k, y=p.gy*(1-k)+wy*k;
    y=clamp(y,10,220);
    p.el.setAttribute("cx",x.toFixed(1));p.el.setAttribute("cy",y.toFixed(1));
    p.el.setAttribute("fill",pp.col);p.el.setAttribute("opacity",pp.op);
  }
  $("ms-microstate").textContent=pp.lab;
  // 温度计
  var y2=TH_YB+TH_A*(T+20);
  $("ms-thfill").setAttribute("y2",y2.toFixed(1));
  $("ms-tempv").textContent=Math.round(T)+"°C";
  // 液面
  var liqZ=16+28*meltP-14*boilP;
  var ly=LQKA*liqZ+LQKB;
  $("ms-liq").setAttribute("points",LQX0+","+ly.toFixed(1)+" "+LQX1+","+ly.toFixed(1)+" "+LQX1+","+(LQKA*4+LQKB).toFixed(1)+" "+LQX0+","+(LQKA*4+LQKB).toFixed(1));
  var le=$("ms-liqtop");le.setAttribute("cy",ly.toFixed(1));
  le.setAttribute("opacity",meltP<=0?0.25:1);
  // 冰块
  $("ms-ice").setAttribute("opacity",(1-meltP).toFixed(2));
  // 火焰
  $("ms-flame").style.display=dir===1?"block":"none";
  // 气泡（沸腾中）
  var boiling=(T===100&&boilP<1);
  for(var bi=0;bi<bubbles.length;bi++){
    var b=bubbles[bi];
    if(boiling){b.style.display="block";var yy=BYB-((t*90+bi*53)%(BYB-BYT));b.setAttribute("cx",(BX0+(BX1-BX0)*((bi*37)%100)/100).toFixed(1));b.setAttribute("cy",yy.toFixed(1));}
    else b.style.display="none";
  }
  // 蒸汽
  for(var si=0;si<steams.length;si++){
    var s=steams[si];
    if(boilP>0.15){s.style.display="block";var sy2=SYY-((t*46+si*61)%110);s.setAttribute("cx",(SXX-24+si*10).toFixed(1));s.setAttribute("cy",sy2.toFixed(1));s.setAttribute("opacity",(0.15+0.5*boilP).toFixed(2));}
    else s.style.display="none";
  }
  // 读数
  $("fx-readline").innerHTML="<b>"+T.toFixed(1)+"°C</b> · "+phase()+" · 累计热量 "+totalQ.toFixed(0)+" kJ";
  // 暂停提示
  var st=$("ms-state");
  if(T===0&&meltP<1){st.style.display="block";st.innerHTML="⏸ <b>温度停在 0°C！</b>热量都去「拆点阵」了——熔化吸热，温度不变。";}
  else if(T===100&&boilP<1){st.style.display="block";st.innerHTML="⏸ <b>温度停在 100°C！</b>热量都去把液态粒子「拆散」成气了——汽化吸热，温度不变。";}
  else{st.style.display="none";st.innerHTML="";}
}
function setState(tv,mp,bp){T=tv;meltP=mp;boilP=bp;dir=0;$("ms-temp").value=String(Math.round(tv));updateAll(tNow);}
$("ms-temp").addEventListener("input",function(e){
  var v=+e.target.value;dir=0;T=v;
  if(v<0){meltP=0;boilP=0;}
  else if(v===0){meltP=0.5;boilP=0;}
  else if(v<100){meltP=1;boilP=0;}
  else{meltP=1;boilP=0.5;}
  updateAll(tNow);
});
$("ms-heat").addEventListener("click",function(){if(!(T===100&&boilP>=1))dir=1;});
$("ms-cool").addEventListener("click",function(){if(T>-20)dir=-1;});
$("ms-reset").addEventListener("click",function(){T=-20;meltP=0;boilP=0;totalQ=0;dir=0;$("ms-temp").value="-20";updateAll(tNow);});
document.addEventListener("keydown",function(e){
  if(e.key>="1"&&e.key<="5")renderStep(+e.key-1);
  else if(e.key==="h"||e.key==="H")$("ms-heat").dispatchEvent(new Event("click"));
});
function onStep(i){
  if(i===0)setState(-20,0,0);
  else if(i===1)setState(-20,0,0);
  else if(i===2)setState(0,0,0);
  else if(i===3)setState(0,1,0);
  else if(i===4)setState(100,1,0);
}
// 六种变化小地图
var MAPINFO={
  melt:["熔化","固态 → 液态（如冰→水）。<b>吸热</b>，温度不变。本页：加热到 0°C 亲手看。"],
  freeze:["凝固","液态 → 固态（如水→冰）。<b>放热</b>，温度不变。本页：从 0°C 的水点「冷却」倒放。"],
  vapor:["汽化","液态 → 气态（如水→水蒸气），包括蒸发和沸腾。<b>吸热</b>。本页：加热到 100°C 看沸腾。"],
  liqui:["液化","气态 → 液态（如水蒸气→水）。<b>放热</b>。本页：从水蒸气点「冷却」，先看到蒸汽变回水。"],
  subli:["升华","固态 → 气态，直接变（如樟脑丸放久变小、干冰冒「烟」、冻衣服变干）。<b>吸热</b>。"],
  depo:["凝华","气态 → 固态，直接变（如霜、雾凇）。<b>放热</b>。"]
};
document.querySelectorAll("#ms-map button").forEach(function(b){
  b.addEventListener("click",function(){
    var m=MAPINFO[b.dataset.map];
    $("ms-maptext").innerHTML="<b>"+m[0]+"</b>："+m[1];
  });
});
// 小测验
(function quiz(){
  var host=$("quiz-body");
  var items=[
    {q:"Q1 · 一杯冰水混合物放在 0°C 的房间里，它的温度是？",opts:["-5°C","0°C","5°C"],ans:1,why:"冰水混合物恒为 0°C——温度由熔点说了算，不是凭感觉猜。"},
    {q:"Q2 · 水沸腾时继续用大火加热，温度会怎样？",opts:["继续升高","保持 100°C 不变","慢慢下降"],ans:1,why:"沸腾时吸热不升温，热量都去把液态粒子拆散成气态了。"}
  ];
  var state=[];
  items.forEach(function(item,qi){
    var d=document.createElement("div");d.className="quiz-qwrap";
    var q=document.createElement("div");q.className="quiz-q";q.textContent=item.q;d.appendChild(q);
    var opts=document.createElement("div");opts.className="quiz-opts";
    var btns=[];
    item.opts.forEach(function(op,oi){
      var b=document.createElement("button");b.className="quiz-opt";b.textContent=op;
      b.dataset.q=String(qi);b.dataset.o=String(oi);
      opts.appendChild(b);btns.push(b);
    });
    d.appendChild(opts);
    var why=document.createElement("div");why.className="quiz-why";why.style.display="none";d.appendChild(why);
    state.push({done:false,btns:btns,why:why});
    host.appendChild(d);
  });
  host.addEventListener("click",function(e){
    var t=e.target;
    if(!t.dataset||t.dataset.o===undefined)return;
    var qi=+t.dataset.q,oi=+t.dataset.o,st=state[qi];
    if(st.done)return;st.done=true;
    var ok=oi===items[qi].ans;
    st.btns.forEach(function(b,bi){
      if(bi===items[qi].ans)b.classList.add("right");
      else if(bi===oi)b.classList.add("wrong");
      b.disabled=true;
    });
    st.why.style.display="block";
    st.why.textContent=(ok?"答对了！":"答错了。")+items[qi].why;
  });
})();
function loop(ts){
  // 固定步长：每帧推进 DQ kJ（与 ts 解耦，测试 pump 可复现）
  if(dir!==0)addHeat(dir*DQ);
  tNow+=1/60;
  updateAll(tNow);
  if(!reduceMotion)requestAnimationFrame(loop);
}
updateAll(0);
renderStep(0);
if(!reduceMotion)requestAnimationFrame(loop);

var $=function(id){return document.getElementById(id);};
var reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var __step=0,__hold=-1;
function renderStep(i){
  __step=i;
  var btns=document.querySelectorAll(".fx-stepbtn");
  btns.forEach(function(b,j){b.classList.toggle("active",i===j);});
  var s=STEPS[i];
  $("fx-steptext").innerHTML="<b>"+s.t.replace(/^\d+\s*[·、]\s*/,"")+"</b>　"+s.html;
  if(typeof onStep==="function")onStep(i);
}
function holdStep(i){__hold=i;renderStep(i);}
function releaseHold(){__hold=-1;}
document.querySelectorAll(".fx-stepbtn").forEach(function(b){
  b.addEventListener("click",function(){holdStep(+b.dataset.step);});
});
(function initTips(){
  var tip=$("fx-tip"),stage=$("fx-stage");
  if(!tip||!stage||typeof TIPS==="undefined")return;
  function show(id,x,y){
    var t=TIPS[id];if(!t)return;
    tip.innerHTML="<b>"+t[0]+"</b><span>"+t[1]+"</span>";
    tip.style.display="block";
    var r=stage.getBoundingClientRect();
    tip.style.left=Math.min(r.width-250,Math.max(8,x-r.left+14))+"px";
    tip.style.top=Math.max(8,y-r.top-10)+"px";
  }
  document.querySelectorAll(".fx-part").forEach(function(el){
    el.addEventListener("pointerenter",function(e){show(el.dataset.tip,e.clientX,e.clientY);});
    el.addEventListener("pointermove",function(e){show(el.dataset.tip,e.clientX,e.clientY);});
    el.addEventListener("pointerleave",function(){tip.style.display="none";});
    el.addEventListener("click",function(e){show(el.dataset.tip,e.clientX,e.clientY);});
  });
})();
