<div class="quiz" id="quiz"><div class="quiz-title">小测验</div><div id="quiz-body"></div></div></main><script type="module">var STEPS=[{"t":"1 · 认识反射","html":"镜面已经摆好（法线垂直于镜面）。<b>拖动太阳</b>改变入射方向：入射线、法线、反射线三线共面，盯住读数——<b>反射角永远等于入射角</b>，法线永远垂直于镜面。"},{"t":"2 · 定光路","html":"母题来了：阳光方向固定、A 点固定，要把光<b>恰好反射到目标 B</b>。反射光线不用猜——<b>目标在哪，它就指向哪</b>。点「连接 A→B」画出反射光线；再点「光路可逆」，看光从 B 沿原路返回太阳。"},{"t":"3 · 定法线","html":"点「画法线」，看法线从入射线与反射线的<b>夹角平分线</b>上长出来（虚线绘制）。核心口诀：<b>法线永远是入射光线与反射光线夹角的角平分线</b>。"},{"t":"4 · 定镜面","html":"镜面出现了，但角度不对，反射光打偏了（灰色虚线是目标光路）。<b>拖动镜面旋转</b>，看反射光扫向目标——当镜面转到<b>与法线垂直</b>时会自动「咔哒」锁定，背光侧刷上斜短线。口诀：<b>镜面是法线的垂线</b>。"},{"t":"5 · 作图挑战","html":"新场景：太阳角度和 B 的位置都随机变了。用三个工具<b>按顺序</b>作图：①连光路 ②画法线 ③放镜面（拖到与法线垂直锁定）。顺序错了会被拦住——这就是考场上的标准作图流程。"}];

var $=function(id){return document.getElementById(id);};

var OX=370,OY=264.285,EXX=1.749,EXY=0.875,EYX=-1.749,EYY=0.875,EZX=0,EZY=-2.142;
var AV=[-10,0,6.5], BF=[44,0,26];
var EPSF=50, MU1=-20; // 母题太阳高度角 / 步骤1 镜面角（法线角 70°）
function P3(x,y,z){return [OX+EXX*x+EYX*y+EZX*z, OY+EXY*x+EYY*y+EZY*z];}
function f1(n){return Math.round(n*10)/10;}
function fmt(n){return (Math.round(n*10)/10).toFixed(1);}
function clamp(v,a,b){return Math.min(b,Math.max(a,v));}
function vNorm(v){var l=Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2])||1;return [v[0]/l,v[1]/l,v[2]/l];}
function incDir(eps){var e=eps*Math.PI/180;return [Math.cos(e),0,-Math.sin(e)];}
function dirTo(a,b){return vNorm([b[0]-a[0],b[1]-a[1],b[2]-a[2]]);}
function reflect(i,n){var d=i[0]*n[0]+i[1]*n[1]+i[2]*n[2];return [i[0]-2*d*n[0],i[1]-2*d*n[1],i[2]-2*d*n[2]];}
function normalOf(eps,B){var i=incDir(eps),r=dirTo(AV,B);return vNorm([r[0]-i[0],0,r[2]-i[2]]);}
function muStarOf(eps,B){var n=normalOf(eps,B);return Math.atan2(-n[0],n[2])*180/Math.PI;}
function nOfMu(mu){var m=mu*Math.PI/180;return [-Math.sin(m),0,Math.cos(m)];}
function mOfMu(mu){var m=mu*Math.PI/180;return [Math.cos(m),0,Math.sin(m)];}
function angOf(v){return Math.atan2(v[2],v[0])*180/Math.PI;}
function angBetween(u,v){var d=u[0]*v[0]+u[1]*v[1]+u[2]*v[2];d=clamp(d,-1,1);return Math.acos(d)*180/Math.PI;}
function fold180(a){while(a>90)a-=180;while(a<-90)a+=180;return a;}
function line(p,q,color,w,dash,op){
  return '<line x1="'+f1(p[0])+'" y1="'+f1(p[1])+'" x2="'+f1(q[0])+'" y2="'+f1(q[1])+'" stroke="'+color+'" stroke-width="'+w+'" fill="none" opacity="'+(op==null?1:op)+'"'+(dash?' stroke-dasharray="6 4"':"")+'/>';
}
function arrowAt(E,dirS,color){
  var len=Math.sqrt(dirS[0]*dirS[0]+dirS[1]*dirS[1])||1;
  var ux=dirS[0]/len,uy=dirS[1]/len,px=-uy,py=ux;
  var b1=[E[0]-ux*10+px*4,E[1]-uy*10+py*4],b2=[E[0]-ux*10-px*4,E[1]-uy*10-py*4];
  return '<polygon points="'+f1(E[0])+','+f1(E[1])+' '+f1(b1[0])+','+f1(b1[1])+' '+f1(b2[0])+','+f1(b2[1])+'" fill="'+color+'"/>';
}
function txt(p,str,size,fill,anchor,weight){
  return '<text x="'+f1(p[0])+'" y="'+f1(p[1])+'" text-anchor="'+(anchor||"middle")+'" font-size="'+size+'" font-weight="'+(weight||400)+'" fill="'+fill+'" font-family="ui-sans-serif,system-ui,sans-serif">'+str+'</text>';
}
function poly(pts,fill,stroke,w){
  return '<polygon points="'+pts.map(function(p){return f1(p[0])+","+f1(p[1]);}).join(" ")+'" fill="'+fill+'"'+(stroke?' stroke="'+stroke+'" stroke-width="'+(w||1)+'"':"")+'/>';
}
function arcA(rr,a1,a2,color){
  var pts=[];
  var stepSgn=a2>=a1?4:-4;
  for(var a=a1;stepSgn>0?a<=a2+0.01:a>=a2-0.01;a+=stepSgn){
    var rad=a*Math.PI/180;
    var p=P3(AV[0]+rr*Math.cos(rad),0,AV[2]+rr*Math.sin(rad));
    pts.push(f1(p[0])+","+f1(p[1]));
  }
  return '<polyline points="'+pts.join(" ")+'" fill="none" stroke="'+color+'" stroke-width="1.4"/>';
}
function rightAngleMark(mu,sc){
  var m=mOfMu(mu),n=nOfMu(mu);
  function Q(a,b){return P3(AV[0]+m[0]*a*sc+n[0]*b*sc,0,AV[2]+m[2]*a*sc+n[2]*b*sc);}
  var pts=[Q(1,0),Q(1,1),Q(0,1)];
  return '<polyline points="'+pts.map(function(p){return f1(p[0])+","+f1(p[1]);}).join(" ")+'" fill="none" stroke="#57575a" stroke-width="1.1"/>';
}
function beam(p,q){
  return line(p,q,"#e8590c",5,false,0.16)+line(p,q,"#e8590c",2.4);
}
function sunAt(S,draggable){
  var c=P3(S[0],S[1],S[2]),s=[];
  s.push('<circle cx="'+f1(c[0])+'" cy="'+f1(c[1])+'" r="13" fill="rgba(255,190,40,.30)"/>');
  s.push('<circle cx="'+f1(c[0])+'" cy="'+f1(c[1])+'" r="8.5" fill="#ffd43b" stroke="#d9930d" stroke-width="1.4"/>');
  s.push('<circle cx="'+f1(c[0])+'" cy="'+f1(c[1])+'" r="3.6" fill="#fff3bf"/>');
  for(var k=0;k<8;k++){
    var a=k*Math.PI/4+0.4,ca=Math.cos(a),sa=Math.sin(a);
    s.push('<line x1="'+f1(c[0]+ca*11)+'" y1="'+f1(c[1]+sa*11)+'" x2="'+f1(c[0]+ca*16)+'" y2="'+f1(c[1]+sa*16)+'" stroke="#d9930d" stroke-width="1.4"/>');
  }
  s.push(txt([c[0],c[1]-24],"太阳",10,"#8a6d1a","middle",700));
  if(draggable)s.push('<circle id="rd-sunhit" class="rd-hit" cx="'+f1(c[0])+'" cy="'+f1(c[1])+'" r="21" fill="rgba(0,0,0,0)"/>');
  return s.join("");
}
function targetAt(B,hit){
  var s=[],r=dirTo(AV,B);
  var mr=[-r[2],0,r[0]];
  function discPt(rad,t){return P3(B[0]+rad*Math.sin(t)*mr[0], B[1]+rad*Math.cos(t), B[2]+rad*Math.sin(t)*mr[2]);}
  function disc(rad,fill,stroke){
    var pts=[];
    for(var t=0;t<=Math.PI*2+0.01;t+=Math.PI/10)pts.push(discPt(rad,t));
    return poly(pts,fill,stroke,1.2);
  }

function partialPath(pts,frac){
  var segs=[],total=0,i;
  for(i=0;i<pts.length-1;i++){
    var dx=pts[i+1][0]-pts[i][0],dy=pts[i+1][1]-pts[i][1];

  }
  var want=frac*total,out=[],head=null,headDir=null,acc=0;
  for(i=0;i<segs.length;i++){
    if(want<=acc)break;
    var p=pts[i],q=pts[i+1],L=segs[i];
    var take=Math.min(L,want-acc),k=L>0?take/L:0;
    var e=[p[0]+(q[0]-p[0])*k,p[1]+(q[1]-p[1])*k];
    out.push([p,e]);head=e;headDir=[q[0]-p[0],q[1]-p[1]];acc+=take;
    if(k<1)break;
  }

}

var dragMode=null;
function pointerWorld(e){
  var svg=$("rd-svg"),rect=svg.getBoundingClientRect();
  var px=(e.clientX-rect.left)/rect.width*740, py=(e.clientY-rect.top)/rect.height*520;
  var pA=P3(AV[0],AV[1],AV[2]);
  var dsx=px-pA[0],dsy=py-pA[1];
  var det=EXX*EZY-EZX*EXY;
  var dx=(dsx*EZY-EZX*dsy)/det, dz=(EXX*dsy-EXY*dsx)/det;
  return [AV[0]+dx,0,AV[2]+dz];
}
$("rd-dyn").addEventListener("pointerdown",function(e){

  dragMode=null;
  if(step===0&&tid==="rd-sunhit")dragMode="sun";
  else if((step===3||(step===4&&ch&&ch.stage>=3))&&tid==="rd-mirrorhit")dragMode="mirror";
  if(!dragMode)return;
  try{$("rd-dyn").setPointerCapture(e.pointerId);}catch(_){}
  if(e.preventDefault)e.preventDefault();

$("rd-dyn").addEventListener("pointermove",function(e){

    applySun(eps);

function newChallenge(){
  var eps=36+Math.random()*24;
  var B=[34+Math.random()*22,0,14+Math.random()*20];
  var ms=muStarOf(eps,B);
  var off=(20+Math.random()*18)*(Math.random()<0.5?-1:1);
  var mu0=clamp(Math.round((ms+off)*2)/2,-52,40);
  if(Math.abs(fold180(mu0-ms))<15)mu0=clamp(Math.round((ms-off)*2)/2,-52,40);
  ch={eps:Math.round(eps*10)/10,B:[Math.round(B[0]*10)/10,0,Math.round(B[2]*10)/10],muStar:Math.round(ms*10)/10,mu:mu0,stage:0,locked:false,done:false,t0:Date.now(),elapsed:0};
  ["rd-ck1","rd-ck2","rd-ck3"].forEach(function(id,k){
    $(id).textContent=["☐ 光线箭头指向目标 B","☐ 法线画成虚线","☐ 镜面 ⊥ 法线 · 斜线在背光侧"][k];
    $(id).classList.remove("done");
  });
  ["rd-tool1","rd-tool2","rd-tool3"].forEach(function(id){$(id).classList.remove("done");});
}
$("rd-tool1").addEventListener("click",function(){
  if(step!==4||!ch)return;
  if(ch.stage!==0){msg("「连光路」已经完成了——作图第一步：定光路（反射光线指向 B）。");return;}
  ch.stage=1;
  $("rd-ck1").textContent="✓ 光线箭头指向目标 B";
  $("rd-ck1").classList.add("done");
  $("rd-tool1").classList.add("done");
  render();
  msg("✓ 光路已定：反射光线连到 B、箭头指向 B。下一步点「② 画法线」。");
});
$("rd-tool2").addEventListener("click",function(){
  if(step!==4||!ch)return;
  if(ch.stage===0){msg("拦住！顺序错了——先「① 连光路」定光路，再画法线。没有光路，法线平分谁的夹角？");return;}
  if(ch.stage!==1){msg("法线已经画好了——它平分入射线与反射线的夹角。");return;}
  ch.stage=2;
  $("rd-ck2").textContent="✓ 法线画成虚线";
  $("rd-ck2").classList.add("done");
  $("rd-tool2").classList.add("done");
  render();
  msg("✓ 法线已定（虚线）：它是两条光线夹角的角平分线。最后点「③ 放镜面」。");
});
$("rd-tool3").addEventListener("click",function(){
  if(step!==4||!ch)return;
  if(ch.stage<2){msg("拦住！顺序错了——镜面是最后一步：先连光路、画法线，镜面必须对着法线来放。");return;}
  if(ch.stage!==2){msg("镜面已经放好了——拖动它，转到与法线垂直。");return;}
  ch.stage=3;
  $("rd-tool3").classList.add("done");
  render();
  msg("镜面已放下，但角度还不对。拖动镜面旋转，转到与法线垂直（90°）时锁定。");
});
$("rd-new").addEventListener("click",function(){
  if(step!==4)return;
  newChallenge();render();
  msg("新场景来了：太阳角度、B 的位置都变了。重新按顺序作图！");
});
$("fx-stage").addEventListener("keydown",function(e){
  if(e.key>="1"&&e.key<="5")renderStep(+e.key-1);
});

var QUIZ=[
  {q:"法线与镜面是什么关系？",o:["互相垂直","互相平行","夹角恒为 45°"],a:0,
   w:"法线就是镜面的垂线：作图时先由角平分线定法线，再过入射点作法线的垂线，就是镜面的位置。"},
  {q:"「光路可逆」指的是什么？",o:["光从 B 沿原来的反射光线反向射入，会沿原来的入射光线从 A 射回——光走的路可以反着走","镜面翻个面也一样能用","反射角可以大于入射角"],a:0,
   w:"在反射（和折射）现象中，光路都是可逆的：正着能走通的路，反着走同样成立。"}
];
var quizState={};
function renderQuiz(){
  var html="";
  QUIZ.forEach(function(qq,qi){
    var st=quizState[qi];
    html+='<div class="quiz-q">'+(qi+1)+". "+qq.q+'</div><div class="quiz-opts">';
    qq.o.forEach(function(op,oi){
      var cls="";
      if(st!=null){if(oi===qq.a)cls=" right";else if(oi===st)cls=" wrong";}
      html+='<button class="quiz-opt'+cls+'" data-q="'+qi+'" data-o="'+oi+'">'+op+"</button>";
    });
    html+="</div>";
    if(st!=null){
      html+='<div class="quiz-why" style="display:block">'+(st===qq.a?"✓ 答对了！":"✗ 再想想。")+qq.w+"</div>";
    }
  });
  $("quiz-body").innerHTML=html;
}
$("quiz-body").addEventListener("click",function(e){
  var t=e.target;if(!t||!t.dataset||t.dataset.q==null)return;
  quizState[+t.dataset.q]=+t.dataset.o;
  renderQuiz();
});
renderQuiz();
renderStep(0);
render();

    var inc1=angBetween((function(){var i=incDir(eps1);return [-i[0],0,-i[2]];})(),nOfMu(MU1));

var $=function(id){return document.getElementById(id);};
var reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var __step=0,__hold=-1;
function renderStep(i){
  __step=i;
  var btns=document.querySelectorAll(".fx-stepbtn");
  btns.forEach(function(b,j){b.classList.toggle("active",i===j);});
  var s=STEPS[i];
  $("fx-steptext").innerHTML="<b>"+s.t.replace(/^\d+\s*[·、]\s*/,"")+"</b>　"+s.html;
  if(typeof onStep==="function")onStep(i);
}
function holdStep(i){__hold=i;renderStep(i);}
function releaseHold(){__hold=-1;}
document.querySelectorAll(".fx-stepbtn").forEach(function(b){
  b.addEventListener("click",function(){holdStep(+b.dataset.step);});
});
(function initTips(){
  var tip=$("fx-tip"),stage=$("fx-stage");
  if(!tip||!stage||typeof TIPS==="undefined")return;
  function show(id,x,y){
    var t=TIPS[id];if(!t)return;
    tip.innerHTML="<b>"+t[0]+"</b><span>"+t[1]+"</span>";
    tip.style.display="block";
    var r=stage.getBoundingClientRect();
    tip.style.left=Math.min(r.width-250,Math.max(8,x-r.left+14))+"px";
    tip.style.top=Math.max(8,y-r.top-10)+"px";
  }
  document.querySelectorAll(".fx-part").forEach(function(el){
    el.addEventListener("pointerenter",function(e){show(el.dataset.tip,e.clientX,e.clientY);});
    el.addEventListener("pointermove",function(e){show(el.dataset.tip,e.clientX,e.clientY);});
    el.addEventListener("pointerleave",function(){tip.style.display="none";});
    el.addEventListener("click",function(e){show(el.dataset.tip,e.clientX,e.clientY);});
  });
})();
